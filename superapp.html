<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>올인원</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: 모바일 = 헤더 + 하단 3탭 + 풀스크린 전체메뉴 + 바텀시트 / 태블릿·데스크톱 = 포털형 상단 헤더 + 메가메뉴 + 12열 대시보드 + 모달 */
:root {
  --bg: #F4F6F9; --card: #FFFFFF; --ink: #10161F; --mut: #6E7887; --ln: #E6EAF0;
  --c: #0A5CFF; --c-soft: #E7EFFF; --y: #FFD43B; --red: #F03E3E;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
button { font: inherit; color: inherit; }
input { font: inherit; color: var(--ink); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ib { background: none; border: 0; padding: 8px; cursor: pointer; display: grid; place-items: center; position: relative; border-radius: 10px; }
.ib:hover { background: rgba(16,22,31,.05); }
.badge { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; padding: 0 4px; }
.mut { color: var(--mut); font-size: 12px; }
.empty { text-align: center; padding: 40px 16px; color: var(--mut); }

/* ---------- 카드 공통 ---------- */
.blk { background: var(--card); border-radius: 14px; padding: 16px; min-width: 0; }
.sh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 8px; }
.sh b { font-size: 15px; }
.sh button { background: none; border: 0; color: var(--mut); font-size: 12px; cursor: pointer; padding: 0; }
.sh button.on { color: var(--c); font-weight: 700; }
.pt { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--c); color: #fff; border-radius: 14px; padding: 16px; }
.pt small { display: block; opacity: .8; font-size: 12px; } .pt b { font-size: 22px; }
.pt button { border: 0; background: var(--y); color: var(--ink); font-weight: 700; border-radius: 8px; padding: 9px 12px; cursor: pointer; font-size: 13px; flex: none; }
.pt button[disabled] { background: rgba(255,255,255,.2); color: #fff; cursor: default; }
.qg { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 14px 4px; }
.sv { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; cursor: pointer; position: relative; line-height: 1.25; text-align: center; padding: 4px 0; border-radius: 10px; }
.sv:hover { background: var(--bg); }
.sv i { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; color: #fff; }
.sv em { position: absolute; top: -2px; left: calc(50% + 12px); width: 20px; height: 20px; border-radius: 50%; font-style: normal; font-weight: 700; color: #fff; display: grid; place-items: center; font-size: 14px; line-height: 1; }
.sv em.rm { background: var(--red); } .sv em.ad { background: var(--c); }
.sv[disabled] { opacity: .35; cursor: not-allowed; }
.editing .qg .sv i { animation: wob .3s ease-in-out infinite alternate; }
@keyframes wob { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
.bill { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--ln); gap: 8px; }
.bill:first-of-type { border-top: 0; padding-top: 0; }
.bill small { display: block; color: var(--mut); font-size: 12px; }
.paid { color: var(--mut); text-decoration: line-through; }
.btn { width: 100%; border: 0; background: var(--c); color: #fff; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; font-size: 14px; }
.btn.y { background: var(--y); color: var(--ink); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.trk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 12px; font-size: 11px; color: var(--mut); text-align: center; }
.trk div::before { content: ""; display: block; height: 4px; border-radius: 2px; background: var(--ln); margin-bottom: 6px; }
.trk .on { color: var(--ink); font-weight: 700; } .trk .on::before { background: var(--c); }
.ad { border-radius: 14px; padding: 18px; background: var(--y); display: flex; flex-direction: column; gap: 2px; justify-content: flex-end; }
.ad small { font-size: 12px; } .ad b { font-size: 17px; line-height: 1.35; }
.stamp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.stamp div { aspect-ratio: 1; max-width: 44px; width: 100%; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--bg); color: var(--mut); }
.stamp .ok { background: var(--y); color: var(--ink); font-weight: 700; }
.ms { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--ln); gap: 8px; }
.ms:first-of-type { border-top: 0; padding-top: 0; }
.ms small { display: block; color: var(--mut); font-size: 12px; }
.ms button { border: 0; border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer; background: var(--c); color: #fff; flex: none; }
.ms button[disabled] { background: var(--bg); color: var(--mut); cursor: default; }
.cps { display: flex; flex-direction: column; gap: 8px; }
.cp { display: flex; border: 1px solid var(--ln); border-radius: 12px; overflow: hidden; }
.cp div:first-child { background: var(--c); color: #fff; padding: 14px; font-weight: 700; display: grid; place-items: center; min-width: 80px; }
.cp div:last-child { padding: 10px 14px; font-size: 13px; } .cp small { color: var(--mut); display: block; font-size: 12px; }
.ck { display: flex; gap: 10px; align-items: center; padding: 10px 0; border: 0; border-top: 1px solid var(--ln); background: none; width: 100%; text-align: left; cursor: pointer; }
.ck:first-of-type { border-top: 0; }
.ck i { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #C5CCD6; display: grid; place-items: center; color: #fff; flex: none; }
.ck.on i { background: var(--c); border-color: var(--c); }
.ck span { flex: 1; } .ck small { display: block; color: var(--mut); font-size: 12px; }
.ck[disabled] { cursor: default; }
.tot { display: flex; justify-content: space-between; padding: 12px 0; font-weight: 700; font-size: 16px; border-top: 2px solid var(--ink); margin-top: 6px; }
.nt { padding: 12px 16px; border-bottom: 1px solid var(--ln); display: flex; flex-direction: column; gap: 2px; }
.nt small { color: var(--mut); font-size: 12px; } .nt .k { font-size: 11px; color: var(--c); font-weight: 700; }
.secs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.secs::-webkit-scrollbar { display: none; }
.secs button { flex: none; border: 1px solid var(--ln); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
.secs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); z-index: 90; background: rgba(16,22,31,.92); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 999px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }

/* ---------- 모바일 ---------- */
.m-top { background: var(--card); padding: 8px 0 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.m-hd { display: flex; align-items: center; gap: 2px; padding: 0 8px 8px 16px; }
.m-hd .loc { flex: 1; font-weight: 700; font-size: 17px; background: none; border: 0; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 2px; padding: 0; }
.m-srch { margin: 0 16px; display: flex; gap: 8px; align-items: center; background: var(--bg); border-radius: 10px; padding: 11px 12px; color: var(--mut); font-size: 13px; border: 0; width: calc(100% - 32px); cursor: pointer; text-align: left; }
.m-pad { padding: 12px 12px calc(env(safe-area-inset-bottom, 0px) + 90px); display: flex; flex-direction: column; gap: 10px; }
.m-bt { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--ln); background: var(--card); padding: 6px 0 calc(env(safe-area-inset-bottom, 0px) + 10px); }
.m-bt button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; color: var(--mut); cursor: pointer; padding: 4px 0; }
.m-bt button.on { color: var(--c); font-weight: 700; }
.full { position: fixed; inset: 0; z-index: 30; background: var(--card); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.full-hd { display: flex; align-items: center; padding: 8px 8px 8px 16px; } .full-hd b { flex: 1; font-size: 18px; }
.full-sr { display: flex; gap: 6px; padding: 0 16px 10px; }
.full-sr input { flex: 1; min-width: 0; border: 0; background: var(--bg); border-radius: 10px; padding: 11px 12px; }
.full .secs { padding: 0 16px 10px; border-bottom: 1px solid var(--ln); }
.full-body { flex: 1; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
.grp { padding: 16px 16px 4px; } .grp h4 { margin: 0 0 12px; font-size: 13px; color: var(--mut); font-weight: 600; }
.scrim { position: fixed; inset: 0; background: rgba(8,10,14,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-height: 85%; overflow-y: auto; background: var(--card); border-radius: 22px 22px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 22px); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--ink); opacity: .2; margin: 0 auto 14px; }

/* ---------- 태블릿·데스크톱 ---------- */
.gh { background: var(--card); border-bottom: 1px solid var(--ln); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; }
.gh-in { max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
.logo { font-weight: 700; font-size: 21px; color: var(--c); letter-spacing: -.03em; background: none; border: 0; cursor: pointer; padding: 0; flex: none; }
.logo span { color: var(--ink); }
.gloc { background: none; border: 0; display: flex; align-items: center; gap: 4px; cursor: pointer; font-weight: 600; flex: none; padding: 6px 8px; border-radius: 8px; }
.gloc:hover { background: var(--bg); }
.gsearch { flex: 1; position: relative; min-width: 0; max-width: 460px; }
.gsearch label { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 10px; padding: 0 12px; color: var(--mut); }
.gsearch input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; outline: none; }
.gsearch label:focus-within { box-shadow: 0 0 0 2px var(--c); }
.drop { display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--card); border: 1px solid var(--ln); border-radius: 12px; box-shadow: 0 16px 32px -12px rgba(16,22,31,.25); padding: 8px; max-height: 360px; overflow-y: auto; }
.gsearch:focus-within .drop, .drop:hover { display: block; }
.drop .row { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 8px; border-radius: 8px; cursor: pointer; text-align: left; }
.drop .row:hover, .drop .row:focus-visible { background: var(--bg); }
.drop .row i { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
.drop .row small { margin-left: auto; color: var(--mut); font-size: 12px; }
.drop .cap { font-size: 12px; color: var(--mut); padding: 4px 8px; }
.gnav { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: none; }
.gnav .lk { background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--mut); }
.gnav .lk:hover { background: var(--bg); color: var(--ink); }
.gnav .lk.on { color: var(--ink); }
.gnav .allb { background: var(--ink); color: #fff; border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.gnav .allb[aria-expanded="true"] { background: var(--c); }
.me { display: flex; align-items: center; gap: 8px; padding-left: 8px; border-left: 1px solid var(--ln); margin-left: 4px; font-size: 13px; }
.me .av { width: 32px; height: 32px; border-radius: 50%; background: var(--c-soft); color: var(--c); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.me b { display: block; font-size: 13px; line-height: 1.2; } .me small { color: var(--c); font-weight: 700; font-size: 12px; }
.bellw { position: relative; }
.npanel { position: absolute; right: 0; top: calc(100% + 8px); width: 340px; background: var(--card); border: 1px solid var(--ln); border-radius: 14px; box-shadow: 0 20px 40px -16px rgba(16,22,31,.3); overflow: hidden; z-index: 60; }
.npanel .h { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--ln); }
.mega { position: absolute; left: 0; right: 0; top: 100%; background: var(--card); border-bottom: 1px solid var(--ln); box-shadow: 0 24px 40px -24px rgba(16,22,31,.35); z-index: 45; }
.mega-in { max-width: 1200px; margin: 0 auto; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 16px; }
.mega-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.mega-top input { flex: 1; min-width: 200px; max-width: 420px; border: 0; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.mcols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; }
.mcol h4 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.mcol h4::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--dot); }
.mcol button { display: flex; width: 100%; align-items: center; gap: 8px; background: none; border: 0; padding: 7px 8px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; }
.mcol button:hover { background: var(--bg); }
.mcol button span { margin-left: auto; color: var(--c); font-size: 11px; font-weight: 700; }
.mega-shade { position: fixed; inset: 0; background: rgba(8,10,14,.25); z-index: 30; border: 0; cursor: default; }
.main { max-width: 1200px; margin: 0 auto; padding: 24px 24px 56px; display: flex; flex-direction: column; gap: 16px; }
.ptitle { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ptitle h1 { margin: 0; font-size: 24px; text-wrap: balance; } .ptitle p { margin: 0; color: var(--mut); }
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.dash .ad { min-height: 100%; }
.foot { max-width: 1200px; margin: 0 auto; padding: 0 24px 32px; color: var(--mut); font-size: 12px; }
.scrim.center { align-items: center; padding: 24px; }
.modal { width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto; background: var(--card); border-radius: 18px; padding: 22px; box-shadow: 0 30px 60px -20px rgba(8,10,14,.5); }
@media (min-width: 768px) {
  .toast { bottom: 32px; }
}
@media (min-width: 768px) and (max-width: 1023px) {
  .gh-in { gap: 10px; padding: 10px 16px; }
  .me { display: none; }
  .gnav .lk { padding: 8px; }
  .main { padding-inline: 16px; }
  .dash { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .s3, .s4, .s5, .s6 { grid-column: span 1; } .s8, .s12 { grid-column: span 2; }
  .mcols { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .foot { padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) { .editing .qg .sv i { animation: none; } * { scroll-behavior: auto !important; } }

/* =====================================================================
   디자인 컨셉 (html[data-concept]) — 기능·마크업은 공유, 모양만 바뀜
   ===================================================================== */
.s7 { grid-column: span 7; } .s9 { grid-column: span 9; }
.lk-card ul { list-style: none; margin: 0; padding: 0; }
.lnk { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.ticker, .w98go { display: none; }
@media (min-width: 768px) and (max-width: 1023px) {
  .s7, .s9, .lk-col { grid-column: span 2; }
}

/* ---------- 디자인 전환 버튼 (모든 컨셉에서 같은 중립 스타일) ---------- */
#ds { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); z-index: 25; font: 13px/1.4 "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #15181D; }
@media (min-width: 768px) { #ds { right: 24px; bottom: 24px; } }
#ds button { font: inherit; color: inherit; border-radius: 0; }
#ds .ds-btn { display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #C9CED6; border-radius: 999px; padding: 8px 14px 8px 12px; cursor: pointer; box-shadow: 0 6px 18px -6px rgba(0,0,0,.35); font-weight: 700; color: #15181D; }
#ds .ds-btn span { font-weight: 400; color: #5B6370; font-size: 12px; }
#ds .ds-btn:focus-visible, #ds .ds-it:focus-visible { outline: 2px solid #2563EB; outline-offset: 2px; }
#ds .ds-panel { position: absolute; right: 0; bottom: calc(100% + 8px); width: 300px; max-width: calc(100vw - 24px); max-height: min(70vh, 520px); overflow-y: auto; background: #FFFFFF; border: 1px solid #C9CED6; border-radius: 14px; box-shadow: 0 20px 40px -12px rgba(0,0,0,.4); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
#ds .ds-h { padding: 6px 8px 8px; font-weight: 700; color: #15181D; }
#ds .ds-h small { display: block; font-weight: 400; color: #5B6370; font-size: 12px; }
#ds .ds-it { display: flex; flex-direction: column; gap: 2px; text-align: left; background: #FFFFFF; border: 1px solid transparent; border-radius: 10px; padding: 9px 10px; cursor: pointer; }
#ds .ds-it:hover { background: #F2F4F7; }
#ds .ds-it.on { background: #EEF3FF; border-color: #2563EB; }
#ds .ds-r { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
#ds .ds-r b { color: #15181D; }
#ds .ds-r em { font-style: normal; font-size: 11px; color: #4B5563; background: #EEF0F3; padding: 1px 6px; border-radius: 6px; }
#ds .ds-r i { font-style: normal; font-size: 11px; font-weight: 700; color: #1D4ED8; margin-left: auto; }
#ds .ds-d { font-size: 12px; color: #5B6370; }

/* =========================== 2. 리퀴드 글래스 =========================== */
[data-concept="glass"] { --bg: #EEF0FF; --card: rgba(255,255,255,.52); --ink: #121628; --mut: #4E576E; --ln: rgba(18,22,40,.10); --c: #2F55F0; --c-soft: rgba(47,85,240,.12); --y: #FFE07A; --red: #F2384A; color-scheme: light; }
[data-concept="glass"] body { background:
    radial-gradient(60% 50% at 8% 6%, #FFC8E6 0, rgba(255,200,230,0) 70%),
    radial-gradient(55% 50% at 95% 4%, #B7D2FF 0, rgba(183,210,255,0) 70%),
    radial-gradient(60% 55% at 85% 95%, #BFF5DE 0, rgba(191,245,222,0) 70%),
    radial-gradient(50% 50% at 0% 100%, #DCCBFF 0, rgba(220,203,255,0) 70%), #EEF0FF; background-attachment: fixed; }
[data-concept="glass"] .blk, [data-concept="glass"] .gh, [data-concept="glass"] .m-top, [data-concept="glass"] .m-bt,
[data-concept="glass"] .npanel, [data-concept="glass"] .mega, [data-concept="glass"] .drop, [data-concept="glass"] .modal,
[data-concept="glass"] .sheet, [data-concept="glass"] .full, [data-concept="glass"] .ad, [data-concept="glass"] .pt {
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255,255,255,.65); box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.25), 0 12px 32px -14px rgba(40,50,110,.30); }
[data-concept="glass"] .blk { border-radius: 28px; padding: 20px; }
[data-concept="glass"] .pt { border-radius: 28px; background: linear-gradient(135deg, rgba(47,85,240,.82), rgba(20,170,200,.70)); padding: 20px; }

[data-concept="win98"] .w98bar .clock { flex: none; box-shadow: inset -1px -1px #FFFFFF, inset 1px 1px #808080; padding: 6px 8px; font-size: 11px; }
[data-concept="win98"] .full { background: #C0C0C0; }
[data-concept="win98"] .full-hd { background: linear-gradient(90deg, #000080, #1084D0); color: #FFFFFF; padding: 3px 3px 3px 8px; margin-bottom: 8px; }
[data-concept="win98"] .full-hd b { font-size: 13px; }
[data-concept="win98"] .full-hd .ib { background: #C0C0C0; color: #000; box-shadow: var(--bv-out); padding: 0; }
[data-concept="win98"] .full .secs { border-bottom: 1px solid #808080; }
[data-concept="win98"] .full-body { background: #FFFFFF; box-shadow: var(--bv-in); margin: 6px; }
[data-concept="win98"] .grp h4 { color: #000080; }
[data-concept="win98"] .toast { background: #FFFFE1; color: #000; border: 1px solid #000; box-shadow: 2px 2px 0 rgba(0,0,0,.4); font-size: 12px; }
[data-concept="win98"] .scrim { background: rgba(0,0,0,.3); }
@media (min-width: 768px) and (max-width: 1023px) { [data-concept="win98"] .lk-grp ul { grid-template-columns: repeat(4, 1fr); } }
</style>

<div id="app"></div>
<div id="ds"></div>

<script>
const $ = s => document.querySelector(s);
const won = n => n.toLocaleString('ko-KR') + '원';
const I = {
  home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4', bell: 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4', menu: 'M4 6h16M4 12h16M4 18h16',
  chev: 'M9 6l6 6-6 6', down: 'M6 9l6 6 6-6', x: 'M6 6l12 12M18 6L6 18', check: 'M5 12l5 5 9-10',
  gift: 'M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0', pin: 'M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12zM12 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4z'
};
const ic = (n, sz = 22, sw = 1.8) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${I[n]}"/></svg>`;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

/* ---------- 데이터 (예시) ---------- */
const SEC = { 생활: '#0A5CFF', 금융: '#12B886', 쇼핑: '#F76707', 교통: '#7048E8', 건강: '#E64980' };
const SV = [['bill', '공과금 납부', '생활'], ['parcel', '택배 조회', '생활'], ['park', '주차 정산', '생활'], ['laundry', '세탁 예약', '생활'],
  ['send', '송금', '금융'], ['pconv', '포인트 전환', '금융'], ['ins', '보험 조회', '금융'], ['credit', '신용 점수', '금융'],
  ['mart', '장보기', '쇼핑'], ['gift', '선물하기', '쇼핑'], ['coupon', '쿠폰함', '쇼핑'], ['used', '중고거래', '쇼핑'],
  ['taxi', '택시 호출', '교통'], ['tcard', '교통카드', '교통'], ['driver', '대리운전', '교통'], ['rent', '렌터카', '교통'],
  ['clinic', '병원 예약', '건강'], ['pharm', '약국 찾기', '건강'], ['walk', '걸음 리워드', '건강'], ['check', '건강검진', '건강']].map(([id, n, sec]) => ({ id, n, sec }));
const sv = id => SV.find(x => x.id === id);
const NOTI = [['공과금', '전기요금 납기가 18일 남았어요', '오늘 09:00'], ['택배', '무선 이어폰이 배송 출발했어요', '오늘 08:12'], ['혜택', '택시 3,000원 할인 쿠폰이 도착했어요', '어제'], ['포인트', '걸음 리워드 50P를 받을 수 있어요', '어제']];
const COUPONS = [['3,000원', '택시 첫 호출', '10.31까지'], ['10%', '장보기 2만원 이상', '10.15까지'], ['무료', '세탁 예약 수거비', '11.07까지']];
const DAYS = ['월', '화', '수', '목', '금', '토', '일'], TODAY = 2;

/* ---------- 디자인 컨셉 ---------- */
const CONCEPTS = [
  { id: 'base', n: '기본', era: '현재', d: '흰 카드와 파랑 포인트의 기본 포털 스타일' },
  { id: 'glass', n: '리퀴드 글래스', era: '2025 트렌드', d: '반투명 유리 패널, 오로라 그라데이션, 떠 있는 캡슐 바' },
  { id: 'brutal', n: '네오 브루탈리즘', era: '2023 트렌드', d: '굵은 검정 테두리, 딱딱한 그림자, 원색 블록과 스티커' },
  { id: 'bento', n: '벤토 다크 미니멀', era: '2024 트렌드', d: '어두운 바탕에 크기가 다른 타일, 한 가지 빛나는 포인트' },
  { id: 'skeuo', n: '스큐어모피즘', era: '2011 레트로', d: '광택 앱 아이콘, 리넨 질감, 박음질 카드와 독' },
  { id: 'win98', n: '윈도우 98', era: 'Y2K 레트로', d: '회색 입체 창, 남색 제목 표시줄, 2000년 포털과 작업 표시줄' }];
let concept = 'base', dsOpen = false;
try { const saved = localStorage.getItem('design-concept'); if (CONCEPTS.some(c => c.id === saved)) concept = saved; } catch (_) {}
document.documentElement.dataset.concept = concept;
const linksCard = () => `<div class="blk lk-card"><div class="sh"><b>서비스 바로가기</b></div>${Object.keys(SEC).map(c => `<div class="lk-grp"><h4>${c}</h4><ul>${SV.filter(x => x.sec === c).map(x => `<li><button class="lnk" data-a="svc" data-v="${x.id}">${x.n}</button></li>`).join('')}</ul></div>`).join('')}</div>`;
const ticker = () => concept === 'win98' ? `<div class="ticker" aria-label="새 소식"><span>[알림] 10월 공과금 납부 기간이에요 · 택시 첫 호출 3,000원 할인 · 걸음 리워드 50P 받아 가세요 · 올인원에 오신 것을 환영합니다!</span></div>` : '';
const clockHM = () => { const d = new Date(); const h = d.getHours(); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`; };

const st = { tab: 'home', all: false, allSec: '전체', aq: '', edit: false, sheet: null, noti: false, notiSeen: false, toast: null,
  quick: ['bill', 'parcel', 'send', 'taxi', 'clinic', 'coupon', 'walk', 'mart'], pts: 12450, att: false,
  bills: [{ n: '전기요금', m: '10월분 · 납기 10.25', a: 42300, paid: false, ck: true }, { n: '도시가스', m: '9월분 · 납기 10.25', a: 31800, paid: false, ck: true }, { n: '아파트 관리비', m: '9월분 · 납기 10.31', a: 186000, paid: false, ck: false }],
  mis: [{ n: '걸음 5,000보 걷기', d: '오늘 6,214보', p: 50, ok: true, got: false }, { n: '앱으로 공과금 납부', d: '이번 달 1회', p: 100, ok: false, got: false }, { n: '친구 초대하기', d: '친구가 가입하면', p: 1000, ok: false, got: false }] };

const mqWide = matchMedia('(min-width: 768px)'), mqDesk = matchMedia('(min-width: 1024px)');
let toastT;
function toast(msg) { st.toast = msg; clearTimeout(toastT); toastT = setTimeout(() => { st.toast = null; render(); }, 2200); }

/* ---------- 공통 블록 ---------- */
const svBtn = (x, extra = '', a = 'svc', dis = false) => `<button class="sv" data-a="${a}" data-v="${x.id}" ${dis ? 'disabled' : ''}><i style="background:${SEC[x.sec]}">${x.n.slice(0, 2)}</i>${x.n}${extra}</button>`;
const pointsCard = () => `<div class="pt"><div><small>내 포인트</small><b class="num">${st.pts.toLocaleString()}P</b></div><button data-a="att" ${st.att ? 'disabled' : ''}>${st.att ? '출석 완료' : '출석하고 +10P'}</button></div>`;
const stampsCard = (full) => `<div class="blk st-card"><div class="sh"><b>출석체크</b><span class="mut">7일 연속이면 +100P</span></div>
  <div class="stamp">${DAYS.map((d, i) => { const ok = i < TODAY || (i === TODAY && st.att); return `<div class="${ok ? 'ok' : ''}" title="${d}요일">${ok ? ic('check', 14, 3) : d}</div>`; }).join('')}</div>
  ${full && !st.att ? '<button class="btn y" data-a="att" style="margin-top:12px">오늘 출석하기 +10P</button>' : ''}</div>`;
const quickCard = () => `<div class="blk q-card ${st.edit ? 'editing' : ''}"><div class="sh"><b>${st.edit ? `퀵메뉴 편집 (${st.quick.length}/8)` : '자주 쓰는 서비스'}</b><button class="${st.edit ? 'on' : ''}" data-a="edit">${st.edit ? '완료' : '편집'}</button></div>
  <div class="qg">${st.quick.map(id => svBtn(sv(id), st.edit ? '<em class="rm" aria-label="빼기">−</em>' : '', st.edit ? 'qrm' : 'svc')).join('')}</div>
  ${st.edit ? `<div class="sh" style="margin-top:18px"><b style="font-size:13px;color:var(--mut)">추가할 수 있는 서비스${st.quick.length >= 8 ? ' · 8개가 가득 찼어요' : ''}</b></div>
  <div class="qg">${SV.filter(x => !st.quick.includes(x.id)).map(x => svBtn(x, '<em class="ad" aria-label="추가">+</em>', 'qadd', st.quick.length >= 8)).join('')}</div>` : ''}</div>`;
const billsCard = () => { const unpaid = st.bills.filter(b => !b.paid);
  return `<div class="blk b-card"><div class="sh"><b>납부할 공과금 ${unpaid.length}건</b><button data-a="sheet" data-v="bill">전체 보기</button></div>
  ${st.bills.map(b => `<div class="bill"><div class="${b.paid ? 'paid' : ''}">${b.n}<small>${b.m}</small></div><b class="num ${b.paid ? 'paid' : ''}">${won(b.a)}</b></div>`).join('')}
  ${unpaid.length ? '<button class="btn" data-a="sheet" data-v="bill" style="margin-top:10px">한 번에 납부하기</button>' : '<div class="mut" style="margin-top:8px;font-size:13px">이번 달 공과금을 모두 냈어요</div>'}</div>`; };
const parcelCard = () => `<div class="blk p-card"><div class="sh"><b>배송 중인 택배</b><button data-a="svc" data-v="parcel">상세</button></div>
  <div style="font-size:13px">무선 이어폰 · 한빛택배</div><div class="mut num">운송장 5521-0039-7713 · 오늘 도착 예정</div>
  <div class="trk"><div class="on">집하</div><div class="on">이동 중</div><div class="on">배송 출발</div><div>도착</div></div></div>`;
const adCard = () => `<div class="ad"><small>10월 혜택</small><b>택시 첫 호출<br>3,000원 할인</b><small>10월 31일까지 · 쿠폰함에 자동 지급</small></div>`;
const missionsCard = () => `<div class="blk mi-card"><div class="sh"><b>오늘의 미션</b><span class="mut">${st.mis.filter(m => m.got).length}/${st.mis.length} 완료</span></div>
  ${st.mis.map((m, i) => `<div class="ms"><div>${m.n}<small>${m.d} · +${m.p.toLocaleString()}P</small></div><button data-a="mis" data-v="${i}" ${!m.ok || m.got ? 'disabled' : ''}>${m.got ? '받음' : m.ok ? '받기' : '진행 전'}</button></div>`).join('')}</div>`;
const couponsCard = () => `<div class="blk cp-card"><div class="sh"><b>내 쿠폰 ${COUPONS.length}장</b></div><div class="cps">${COUPONS.map(([a, n, d]) => `<div class="cp"><div>${a}</div><div>${n}<small>${d}</small></div></div>`).join('')}</div></div>`;
const notiList = () => NOTI.map(([k, t, d]) => `<div class="nt"><span class="k">${k}</span>${t}<small>${d}</small></div>`).join('');
const unreadN = () => st.notiSeen ? 0 : NOTI.length;
const match = q => SV.filter(x => !q || x.n.replace(/\s/g, '').includes(q.replace(/\s/g, '')) || x.sec === q);

/* 전체 서비스 목록 (모바일 그리드 / 데스크톱 컬럼) */
function allList(wide) {
  const list = match(st.aq).filter(x => st.allSec === '전체' || x.sec === st.allSec);
  if (!list.length) return `<div class="empty">‘${esc(st.aq)}’ 서비스를 찾지 못했어요.<br>다른 단어로 검색해 보세요.</div>`;
  const secs = Object.keys(SEC).filter(c => list.some(x => x.sec === c));
  if (wide) return `<div class="mcols">${secs.map(c => `<div class="mcol" style="--dot:${SEC[c]}"><h4>${c}</h4>${list.filter(x => x.sec === c).map(x => `<button data-a="svc" data-v="${x.id}">${x.n}${st.quick.includes(x.id) ? '<span>퀵</span>' : ''}</button>`).join('')}</div>`).join('')}</div>`;
  return secs.map(c => `<div class="grp"><h4>${c}</h4><div class="qg">${list.filter(x => x.sec === c).map(x => svBtn(x)).join('')}</div></div>`).join('');
}
const secChips = () => `<div class="secs">${['전체', ...Object.keys(SEC)].map(c => `<button class="${st.allSec === c ? 'on' : ''}" data-a="sec" data-v="${c}">${c}</button>`).join('')}</div>`;
function hqResults(q) {
  q = (q || '').trim();
  if (!q) return `<div class="cap">자주 찾는 서비스</div>${['taxi', 'bill', 'clinic', 'parcel'].map(id => hqRow(sv(id))).join('')}`;
  const r = match(q);
  return r.length ? `<div class="cap">서비스 ${r.length}개</div>${r.map(hqRow).join('')}` : `<div class="cap">‘${esc(q)}’와 맞는 서비스가 없어요</div>`;
}
const hqRow = x => `<button class="row" data-a="svc" data-v="${x.id}"><i style="background:${SEC[x.sec]}">${x.n.slice(0, 2)}</i>${x.n}<small>${x.sec}</small></button>`;

/* 시트·모달 내용 */
function sheetBody() {
  if (st.sheet === 'bill') {
    const sel = st.bills.filter(b => b.ck && !b.paid), sum = sel.reduce((a, b) => a + b.a, 0);
    return `<div class="sh"><b style="font-size:18px" id="dlg-t">공과금 납부</b><button class="ib" data-a="sheet" aria-label="닫기">${ic('x', 20)}</button></div>
      ${st.bills.map((b, i) => `<button class="ck ${b.ck && !b.paid ? 'on' : ''}" data-a="bck" data-v="${i}" ${b.paid ? 'disabled' : ''}><i>${ic('check', 12, 3)}</i><span class="${b.paid ? 'paid' : ''}">${b.n}<small>${b.paid ? '납부 완료' : b.m}</small></span><b class="num">${won(b.a)}</b></button>`).join('')}
      <div class="tot"><span>총 ${sel.length}건</span><span class="num">${won(sum)}</span></div>
      <div class="mut" style="margin-bottom:12px">결제수단: 머니뱅크 ••• 3021 · 포인트 ${st.pts.toLocaleString()}P 사용 가능</div>
      <button class="btn" data-a="pay" ${sel.length ? '' : 'disabled'}>${won(sum)} 납부하기</button>`;
  }
  const x = sv(st.sheet), inQ = st.quick.includes(x.id);
  return `<div style="display:flex;gap:12px;align-items:center"><i style="width:54px;height:54px;border-radius:14px;background:${SEC[x.sec]};color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;flex:none">${x.n.slice(0, 2)}</i>
    <div style="flex:1;min-width:0"><b style="font-size:18px" id="dlg-t">${x.n}</b><div class="mut">${x.sec} · 제휴사에서 제공</div></div><button class="ib" data-a="sheet" aria-label="닫기">${ic('x', 20)}</button></div>
    <p class="mut" style="font-size:13px;margin:16px 0">서비스를 처음 쓰면 제휴사 이용약관과 개인정보 제3자 제공에 동의해야 해요. 동의는 한 번만 받아요.</p>
    <div style="display:flex;flex-direction:column;gap:8px"><button class="btn" data-a="${x.id === 'bill' ? 'tobill' : 'start'}">시작하기</button>
    <button class="btn y" data-a="qtoggle" data-v="${x.id}">${inQ ? '자주 쓰는 서비스에서 빼기' : '자주 쓰는 서비스에 추가'}</button></div>`;
}

/* ---------- 모바일 셸 ---------- */
function mobile() {
  let body;
  if (st.tab === 'home') {
    body = `<div class="m-top"><div class="m-hd"><button class="loc" data-a="noop">성수2가 ${ic('down', 16)}</button>
      <button class="ib" data-a="noti" aria-label="알림">${ic('bell')}${unreadN() ? `<span class="badge">${unreadN()}</span>` : ''}</button><button class="ib" data-a="openall" aria-label="전체 서비스">${ic('menu')}</button></div>
      <button class="m-srch" data-a="openall">${ic('search', 16)} 서비스 ${SV.length}개 중에서 찾기</button></div>
      <div class="m-pad">${ticker()}${pointsCard()}${quickCard()}${st.edit ? '' : billsCard() + parcelCard() + adCard() + missionsCard()}</div>`;
  } else {
    body = `<div class="m-top" style="padding-bottom:6px"><div class="m-hd"><span class="loc" style="cursor:default">혜택</span><button class="ib" data-a="noti" aria-label="알림">${ic('bell')}${unreadN() ? `<span class="badge">${unreadN()}</span>` : ''}</button></div></div>
      <div class="m-pad">${ticker()}${pointsCard()}${stampsCard(true)}${missionsCard()}${couponsCard()}</div>`;
  }
  const nav = concept === 'win98' ? `<nav class="m-bt w98bar"><button class="start ${st.all ? 'on' : ''}" data-a="openall"><i aria-hidden="true"></i>시작</button>${[['home', '홈'], ['benefit', '혜택']].map(([k, l]) =>
    `<button class="task ${!st.all && st.tab === k ? 'on' : ''}" data-a="tab" data-v="${k}" ${!st.all && st.tab === k ? 'aria-current="page"' : ''}>${l}</button>`).join('')}<span class="clock num">${clockHM()}</span></nav>` : `<nav class="m-bt">${[['home', '홈', 'home'], ['benefit', '혜택', 'gift'], ['all', '전체', 'grid']].map(([k, l, i]) =>
    `<button class="${(k === 'all' ? st.all : !st.all && st.tab === k) ? 'on' : ''}" data-a="${k === 'all' ? 'openall' : 'tab'}" data-v="${k}" ${!st.all && st.tab === k ? 'aria-current="page"' : ''}>${ic(i)}${l}</button>`).join('')}</nav>`;
  let over = '';
  if (st.all) over += `<div class="full" role="dialog" aria-modal="true" aria-label="전체 서비스"><div class="full-hd"><b>전체 서비스</b><button class="ib" data-a="closeall" aria-label="닫기">${ic('x')}</button></div>
    <div class="full-sr"><input id="aq" data-live="aq" value="${esc(st.aq)}" placeholder="예: 택시, 납부, 병원" aria-label="서비스 검색" autocomplete="off"></div>${secChips()}
    <div class="full-body"><div id="allres">${allList(false)}</div><div style="padding:16px" class="mut">찾는 서비스가 없나요? 고객센터에 제안하기 ›</div></div></div>`;
  if (st.noti) over += `<div class="full" role="dialog" aria-modal="true" aria-label="알림"><div class="full-hd"><b>알림</b><button class="ib" data-a="noti" aria-label="닫기">${ic('x')}</button></div><div class="full-body">${notiList()}</div></div>`;
  if (st.sheet) over += `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="grab"></div>${sheetBody()}</div></div>`;
  return body + nav + over;
}

/* ---------- 태블릿·데스크톱 셸 ---------- */
function desktop() {
  const header = `<header class="gh"><div class="gh-in">
    <button class="logo" data-a="tab" data-v="home" aria-label="올인원 홈">올인원<span>.</span></button>
    <button class="gloc" data-a="noop">${ic('pin', 16)}성수2가${ic('down', 14)}</button>
    <div class="gsearch"><label>${ic('search', 18)}<input id="hq" data-live="hq" placeholder="서비스 검색 (예: 택시, 납부, 병원)" aria-label="서비스 검색" autocomplete="off"></label><div class="drop" id="hqres">${hqResults('')}</div>${concept === 'win98' ? '<button class="w98go" data-a="hqgo">검색</button>' : ''}</div>
    <nav class="gnav" aria-label="주요 메뉴">
      <button class="lk ${st.tab === 'home' && !st.all ? 'on' : ''}" data-a="tab" data-v="home" ${st.tab === 'home' ? 'aria-current="page"' : ''}>홈</button>
      <button class="lk ${st.tab === 'benefit' && !st.all ? 'on' : ''}" data-a="tab" data-v="benefit" ${st.tab === 'benefit' ? 'aria-current="page"' : ''}>혜택</button>
      <button class="allb" data-a="${st.all ? 'closeall' : 'openall'}" aria-expanded="${st.all}">${ic(st.all ? 'x' : 'grid', 16, 2)}전체 서비스</button>
      <div class="bellw"><button class="ib" data-a="noti" aria-label="알림" aria-expanded="${st.noti}">${ic('bell')}${unreadN() ? `<span class="badge">${unreadN()}</span>` : ''}</button>
        ${st.noti ? `<div class="npanel" role="dialog" aria-label="알림"><div class="h"><b>알림</b><button class="ib" data-a="noti" aria-label="닫기">${ic('x', 18)}</button></div>${notiList()}</div>` : ''}</div>
      <div class="me"><div class="av">하늘</div><div><b>김하늘 님</b><small class="num">${st.pts.toLocaleString()}P</small></div></div>
    </nav></div>
    ${st.all ? `<div class="mega" role="dialog" aria-label="전체 서비스"><div class="mega-in"><div class="mega-top"><b style="font-size:17px">전체 서비스 ${SV.length}개</b>
      <input id="aq" data-live="aq" value="${esc(st.aq)}" placeholder="서비스 이름으로 찾기" aria-label="전체 서비스 검색" autocomplete="off">${secChips()}</div>
      <div id="allres">${allList(true)}</div><div class="mut">‘퀵’ 표시는 홈의 자주 쓰는 서비스에 들어 있는 항목이에요.</div></div></div>` : ''}
  </header>${st.all ? '<button class="mega-shade" data-a="closeall" aria-label="전체 서비스 닫기"></button>' : ''}`;
  let main;
  if (st.tab === 'home') {
    main = `${ticker()}<div class="ptitle"><h1>하늘 님, 오늘 챙길 일 3가지</h1><p>공과금 ${st.bills.filter(b => !b.paid).length}건 · 택배 1건 · 미션 ${st.mis.filter(m => m.ok && !m.got).length}개 받기 가능</p></div>
      ${concept === 'bento' ? `<div class="dash bento">
        <div class="s3">${pointsCard()}</div><div class="s6">${quickCard()}</div><div class="s3">${parcelCard()}</div>
        <div class="s5">${billsCard()}</div><div class="s4">${missionsCard()}</div><div class="s3">${adCard()}</div>
        <div class="s4">${stampsCard(false)}</div><div class="s8">${couponsCard()}</div></div>`
      : concept === 'win98' ? `<div class="dash"><div class="s3 lk-col">${linksCard()}</div><div class="s9"><div class="dash">
        <div class="s5 stack">${pointsCard()}${stampsCard(false)}</div><div class="s7">${quickCard()}</div>
        <div class="s6">${billsCard()}</div><div class="s6 stack">${parcelCard()}${adCard()}</div>
        <div class="s6">${missionsCard()}</div><div class="s6">${couponsCard()}</div></div></div></div>`
      : `<div class="dash">
        <div class="s4 stack">${pointsCard()}${stampsCard(false)}</div>
        <div class="s8">${quickCard()}</div>
        <div class="s5">${billsCard()}</div>
        <div class="s4">${parcelCard()}</div>
        <div class="s3" style="align-self:stretch">${adCard()}</div>
        <div class="s6">${missionsCard()}</div>
        <div class="s6">${couponsCard()}</div>
      </div>`}`;
  } else {
    main = `${ticker()}<div class="ptitle"><h1>혜택</h1><p>출석과 미션으로 포인트를 모으고, 받은 쿠폰을 확인하세요.</p></div>
      <div class="dash"><div class="s4 stack">${pointsCard()}${stampsCard(true)}</div><div class="s4">${missionsCard()}</div><div class="s4">${couponsCard()}</div>
      <div class="s12">${adCard()}</div></div>`;
  }
  const modal = st.sheet ? `<div class="scrim center" data-a="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-t">${sheetBody()}</div></div>` : '';
  return header + `<main class="main">${main}</main><footer class="foot">올인원 · 예시 서비스이며 제품명, 금액, 인물은 모두 가상입니다.</footer>` + modal;
}

/* ---------- 렌더 ---------- */
function render() {
  const fx = document.activeElement && document.activeElement.id;
  const caret = fx && document.activeElement.selectionStart;
  const hqVal = ($('#hq') || {}).value || '';
  $('#app').innerHTML = (mqWide.matches ? desktop() : mobile()) + (st.toast ? `<div class="toast" role="status">${st.toast}</div>` : '');
  const hq = $('#hq'); if (hq && hqVal) { hq.value = hqVal; $('#hqres').innerHTML = hqResults(hqVal); }
  document.body.style.overflow = (!mqWide.matches && (st.all || st.noti)) || st.sheet ? 'hidden' : '';
  if (fx) { const el = document.getElementById(fx); if (el) { el.focus(); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch (_) {} } }
}

const ACT = {
  tab: v => { st.tab = v; st.all = false; st.edit = false; st.noti = false; window.scrollTo(0, 0); },
  openall: () => { st.all = true; st.edit = false; st.noti = false; setTimeout(() => { const a = $('#aq'); if (a && mqWide.matches) a.focus(); }); },
  closeall: () => st.all = false,
  sec: v => st.allSec = v,
  noti: () => { st.noti = !st.noti; st.notiSeen = true; },
  att: () => { if (!st.att) { st.att = true; st.pts += 10; toast('출석 완료 · 10P 적립'); } },
  edit: () => st.edit = !st.edit,
  qrm: v => { if (st.quick.length <= 4) return toast('퀵메뉴는 4개 이상 두어야 해요'); st.quick = st.quick.filter(q => q !== v); },
  qadd: v => { if (st.quick.length < 8) st.quick.push(v); },
  svc: v => { st.sheet = v; st.noti = false; const h = $('#hq'); if (h) { h.value = ''; h.blur(); } },
  sheet: v => st.sheet = v || null,
  scrim: (v, el, e) => { if (e.target === el) st.sheet = null; },
  tobill: () => { st.sheet = 'bill'; st.all = false; },
  start: () => { st.sheet = null; st.all = false; toast('예시는 여기까지예요'); },
  qtoggle: v => { if (st.quick.includes(v)) { if (st.quick.length <= 4) return toast('퀵메뉴는 4개 이상 두어야 해요'); st.quick = st.quick.filter(q => q !== v); toast('자주 쓰는 서비스에서 뺐어요'); }
    else if (st.quick.length >= 8) toast('퀵메뉴는 8개까지예요. 하나를 먼저 빼 주세요'); else { st.quick.push(v); toast('자주 쓰는 서비스에 추가했어요'); } },
  bck: v => st.bills[+v].ck = !st.bills[+v].ck,
  pay: () => { let n = 0; st.bills.forEach(b => { if (b.ck && !b.paid) { b.paid = true; n++; } }); st.mis[1].ok = true; st.mis[1].d = '이번 달 납부 완료'; st.sheet = null; toast(`${n}건 납부 완료 · 미션 달성, 혜택에서 100P 받기`); },
  mis: v => { const m = st.mis[+v]; if (m.ok && !m.got) { m.got = true; st.pts += m.p; toast(`${m.p.toLocaleString()}P 받았어요`); } },
  hqgo: () => { const h = $('#hq'), r = match((h && h.value || '').trim()); if (h && h.value.trim() && r.length) ACT.svc(r[0].id); else toast('서비스 이름을 입력해 주세요'); },
  noop: () => toast('예시 화면이라 이동하지 않아요')
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (st.noti && mqWide.matches && !e.target.closest('.bellw')) { st.noti = false; if (!b) { render(); return; } }
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.a]; if (!fn) return;
  fn(b.dataset.v, b, e); render();
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.live; if (!k) return;
  if (k === 'aq') { st.aq = e.target.value.trim(); if (st.aq) st.allSec = '전체'; const r = $('#allres'); if (r) r.innerHTML = allList(mqWide.matches);
    document.querySelectorAll('.secs button').forEach(x => x.classList.toggle('on', x.dataset.v === st.allSec)); }
  if (k === 'hq') $('#hqres').innerHTML = hqResults(e.target.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (st.sheet) st.sheet = null; else if (st.noti) st.noti = false; else if (st.all) st.all = false; else if (st.edit) st.edit = false; else return; render(); }
  if (e.key === 'Enter' && e.target.id === 'hq') { const r = match(e.target.value.trim()); if (r.length) { e.preventDefault(); ACT.svc(r[0].id); render(); } }
});
mqWide.addEventListener('change', render); mqDesk.addEventListener('change', render);

/* ---------- 디자인 전환 ---------- */
function setConcept(id) {
  if (!CONCEPTS.some(c => c.id === id)) return;
  concept = id; document.documentElement.dataset.concept = id;
  try { localStorage.setItem('design-concept', id); } catch (_) {}
  render(); renderDs();
}
window.setConcept = setConcept;
function renderDs() {
  const c = CONCEPTS.find(x => x.id === concept);
  $('#ds').innerHTML = `<button class="ds-btn" data-ds="toggle" aria-expanded="${dsOpen}" aria-controls="ds-panel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.5-.8 1.5-1.6 0-1.3-1-1.6-1-2.9 0-1 .8-1.5 1.8-1.5H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>디자인<span>${c.n}</span></button>`
    + (dsOpen ? `<div class="ds-panel" id="ds-panel" role="dialog" aria-label="디자인 컨셉 선택"><div class="ds-h">디자인 컨셉 <small>${CONCEPTS.length}종 · 기능은 모두 같아요</small></div>
      ${CONCEPTS.map(x => `<button class="ds-it ${x.id === concept ? 'on' : ''}" data-ds="${x.id}" aria-pressed="${x.id === concept}"><span class="ds-r"><b>${x.n}</b><em>${x.era}</em>${x.id === concept ? '<i>사용 중</i>' : ''}</span><span class="ds-d">${x.d}</span></button>`).join('')}</div>` : '');
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-ds]');
  if (t) { e.stopPropagation(); const v = t.dataset.ds; if (v === 'toggle') dsOpen = !dsOpen; else setConcept(v); renderDs(); if (v === 'toggle' && dsOpen) { const on = document.querySelector('.ds-it.on'); if (on) on.focus(); } return; }
  if (dsOpen && !e.target.closest('#ds')) { dsOpen = false; renderDs(); e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener('keydown', e => {
  if (dsOpen && e.key === 'Escape') { e.stopPropagation(); dsOpen = false; renderDs(); const b = document.querySelector('.ds-btn'); if (b) b.focus(); }
}, true);
setInterval(() => { const c = document.querySelector('.w98bar .clock'); if (c) c.textContent = clockHM(); }, 30000);
render(); renderDs();
</script>

</body>
</html>
