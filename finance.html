<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>머니로그</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+KR:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout: 모바일은 하단 플로팅 필 내비 + 1열 카드, 태블릿·데스크톱은 왼쪽 세로 플로팅 필 레일 + 카드 그리드 대시보드 */
:root {
  --bg: #EDF0F7; --card: #FFFFFF; --ink: #1A1D2E; --mut: #6F7590; --c: #3D46D6; --c2: #E6E8FB; --pos: #17985A; --neg: #D6453D; --ln: #E8EBF2;
  --body: "Gowun Dodum", "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
  --num: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.n { font-family: var(--num); font-weight: 700; font-variant-numeric: tabular-nums; }
.lbl { font-size: 13px; color: var(--mut); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card { background: var(--card); border-radius: 26px; padding: 20px; min-width: 0; }
h3 { margin: 0 0 12px; font-size: 16px; font-weight: 400; }
.ib { background: none; border: 0; padding: 8px; border-radius: 12px; cursor: pointer; display: grid; place-items: center; position: relative; }
.ib:hover { background: var(--c2); }

/* ---- app shell ---- */
.main { padding-inline: 18px; padding-block: 18px 120px; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.top b { font-size: 20px; font-weight: 400; }
.top .acts { display: flex; gap: 6px; align-items: center; }
.dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--neg); }
.sendbtn { display: none; border: 0; background: var(--c); color: #fff; border-radius: 999px; padding: 10px 18px; cursor: pointer; font-family: var(--num); font-weight: 600; font-size: 14px; align-items: center; gap: 6px; }

.rail { position: fixed; z-index: 20; background: var(--ink); border-radius: 999px; padding: 6px; display: flex; gap: 4px; box-shadow: 0 14px 30px rgba(26,29,46,.32);
  left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.rail .brand { display: none; }
.rail button { border: 0; background: none; color: #9AA0BC; border-radius: 999px; height: 46px; min-width: 46px; padding: 0 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.rail button:hover { color: #fff; }
.rail button.on { background: #fff; color: var(--ink); padding: 0 16px 0 12px; }
.rail button .t { display: none; }
.rail button.on .t { display: inline; }

.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }

/* home */
.tot { background: var(--ink); color: #fff; border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.tot::after { content: ""; position: absolute; right: -50px; top: -60px; width: 200px; height: 200px; border-radius: 50%; border: 28px solid rgba(255,255,255,.05); pointer-events: none; }
.tot small { opacity: .72; font-size: 13px; }
.tot .n { font-size: 32px; }
.tot .eye { align-self: flex-start; border: 0; background: rgba(255,255,255,.13); color: #fff; border-radius: 999px; padding: 5px 13px; font-size: 12px; cursor: pointer; margin-top: 8px; }
.qa { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qa button { border: 0; background: var(--card); border-radius: 20px; padding: 14px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
.qa button:hover { background: var(--c2); }
.qa i { width: 36px; height: 36px; border-radius: 50%; background: var(--c2); color: var(--c); display: grid; place-items: center; }
.ac { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--ln); gap: 10px; }
.ac:first-of-type { border-top: 0; padding-top: 0; }
.ac small { display: block; color: var(--mut); font-size: 12px; }
.tx { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; }
.tx small { display: block; color: var(--mut); font-size: 12px; }
.cic { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; font-size: 12px; font-family: var(--num); font-weight: 700; color: var(--ink); }
.pos { color: var(--pos); }
.track { height: 10px; border-radius: 5px; background: var(--c2); overflow: hidden; } .track i { display: block; height: 100%; border-radius: 5px; background: var(--c); }
.track.over i { background: var(--neg); }
.chart { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 22px; }
.chart div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; font-size: 12px; color: var(--mut); }
.chart i { width: 100%; max-width: 44px; border-radius: 10px 10px 4px 4px; background: var(--c2); display: block; position: relative; }
.chart .now i { background: var(--c); }
.chart em { font-style: normal; font-family: var(--num); font-size: 11px; color: var(--ink); }
.link { background: none; border: 0; color: var(--mut); font-size: 13px; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
.link:hover { color: var(--c); }

/* transactions */
.mon { display: flex; align-items: center; gap: 12px; font-size: 18px; }
.mon button { border: 0; background: var(--card); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.mon button[disabled] { opacity: .3; cursor: not-allowed; }
.io { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.io div { background: var(--card); border-radius: 20px; padding: 14px 16px; font-size: 12px; color: var(--mut); }
.io .n { display: block; font-size: 18px; color: var(--ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 0; background: var(--card); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-size: 13px; }
.chips button.on { background: var(--ink); color: #fff; }
.txbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.day { font-size: 12px; color: var(--mut); margin: 4px 0 -8px 6px; }
.tw { overflow-x: auto; }
table.txt { width: 100%; border-collapse: collapse; font-size: 14px; }
.txt th { text-align: left; font-weight: 400; font-size: 12px; color: var(--mut); padding: 0 12px 10px; border-bottom: 1px solid var(--ln); }
.txt td { padding: 12px; border-bottom: 1px solid var(--ln); vertical-align: middle; }
.txt tr:last-child td { border-bottom: 0; }
.txt .r { text-align: right; }
.txt .tag { display: inline-flex; align-items: center; gap: 8px; }
.txt .tag i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.txt tbody tr:hover td { background: #F7F8FC; }

/* budget */
.bg { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border: 0; border-top: 1px solid var(--ln); background: none; text-align: left; cursor: pointer; width: 100%; }
.bg:first-of-type { border-top: 0; padding-top: 0; }
.bg:hover .track { box-shadow: 0 0 0 2px var(--c2); }
.over-t { color: var(--neg); font-size: 12px; }
.stp { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 0 14px; }
.stp button { border: 0; background: var(--c2); color: var(--c); width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.donut { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 13px; width: 100%; }
.legend span { display: flex; align-items: center; gap: 6px; } .legend i { width: 10px; height: 10px; border-radius: 3px; }

/* card */
.vcard { border-radius: 24px; padding: 22px; aspect-ratio: 1.586; max-width: 100%; color: #fff; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(135deg, #3D46D6, #1A1D2E 85%); position: relative; overflow: hidden; transition: filter .2s; }
.vcard.lock { filter: grayscale(1) brightness(.8); }
.vcard::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; border: 24px solid rgba(255,255,255,.08); }
.vcard .num { font-size: 18px; letter-spacing: .12em; }
.set { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-top: 1px solid var(--ln); gap: 12px; }
.set:first-child { border-top: 0; padding-top: 0; }
.set small { display: block; font-size: 12px; color: var(--mut); }
.sw { width: 46px; height: 28px; border-radius: 14px; border: 0; position: relative; cursor: pointer; flex: none; background: #CDD2E0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .18s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.sw.on { background: var(--c); } .sw.on::after { left: 21px; }

/* transfer flow: 모바일 전체 화면, 태블릿 이상 모달 */
.flowwrap { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.flow { display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%; }
.fh { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px; } .fh .t { flex: 1; font-size: 17px; }
.steps { display: flex; gap: 4px; padding: 0 20px 6px; } .steps i { flex: 1; height: 4px; border-radius: 2px; background: #D5D9E8; } .steps i.on { background: var(--c); }
.fb { flex: 1; overflow-y: auto; padding: 8px 20px; display: flex; flex-direction: column; gap: 12px; }
.rcp { display: flex; gap: 12px; align-items: center; background: var(--card); border: 0; border-radius: 18px; padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; }
.rcp:hover { box-shadow: inset 0 0 0 2px var(--c2); }
.rcp .av { width: 40px; height: 40px; border-radius: 50%; background: var(--c2); color: var(--c); display: grid; place-items: center; flex: none; }
.rcp small { display: block; font-size: 12px; color: var(--mut); }
.inp { border: 0; background: var(--card); border-radius: 14px; padding: 13px 14px; width: 100%; }
.amt { text-align: center; padding: 18px 0 4px; } .amt .n { font-size: 34px; } .amt .ph { color: #B8BCCD; }
.amt .err { color: var(--neg); font-size: 13px; min-height: 22px; }
.quick { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; } .quick button { border: 0; background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; }
.kp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.kp button { border: 0; background: none; font-size: 22px; padding: 12px 0; cursor: pointer; border-radius: 14px; font-family: var(--num); }
.kp button:hover, .kp button:active { background: var(--card); }
.kbd { text-align: center; font-size: 12px; color: var(--mut); display: none; }
.fbtn { margin: 10px 20px 20px; border: 0; background: var(--c); color: #fff; border-radius: 18px; padding: 16px; font-size: 16px; cursor: pointer; font-family: var(--num); font-weight: 600; }
.fbtn[disabled] { opacity: .35; cursor: not-allowed; }
.done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 30px 0; }
.done i { width: 76px; height: 76px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: rgba(26,29,46,.94); color: #fff; font-size: 14px; padding: 10px 18px; border-radius: 999px; white-space: nowrap; animation: up .2s ease-out; }
@keyframes up { from { transform: translate(-50%, 8px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.empty { text-align: center; padding: 40px 16px; color: var(--mut); }
.desk { display: none; }

/* ---- tablet & desktop ---- */
@media (min-width: 768px) {
  .rail { left: 18px; top: 50%; bottom: auto; transform: translateY(-50%); flex-direction: column; padding: 8px; }
  .rail button, .rail button.on { padding: 0; width: 48px; height: 48px; justify-content: center; }
  .rail button.on .t { display: none; }
  .rail .brand { display: grid; place-items: center; width: 48px; height: 48px; color: #fff; font-family: var(--num); font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .rail .sep { height: 1px; background: rgba(255,255,255,.12); margin: 4px 8px; }
  .rail button[data-tip] { position: relative; }
  .rail button[data-tip]:hover::after, .rail button[data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; left: 60px; background: var(--ink); color: #fff; padding: 5px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; }
  .main { padding-inline: 112px 32px; padding-block: 28px 48px; gap: 20px; }
  .top b { font-size: 24px; }
  .sendbtn { display: inline-flex; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span2 { grid-column: 1 / -1; }
  .flowwrap { background: rgba(26,29,46,.45); align-items: center; justify-content: center; padding: 24px; }
  .flow { background: var(--bg); border-radius: 28px; max-width: 440px; max-height: min(760px, 100%); box-shadow: 0 30px 60px rgba(10,14,30,.35); overflow: hidden; flex: none; height: 100%; }
  .kbd { display: block; }
  .toast { bottom: 28px; }
  .desk { display: block; }
}
@media (min-width: 1024px) {
  .main { padding-inline: 128px 40px; }
  .home { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .home > .tot { grid-column: span 5; } .home > .qa-card { grid-column: span 7; }
  .home > .acc { grid-column: span 5; } .home > .chart-card { grid-column: span 7; }
  .home > .recent { grid-column: span 7; } .home > .bsum { grid-column: span 5; }
  .qa-card .qa { height: 100%; }
  .qa button { padding: 20px 0 16px; font-size: 14px; } .qa i { width: 44px; height: 44px; }
  .bud { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
  .cardpg { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ================= 디자인 전환 버튼 (모든 컨셉에서 같은 중립 스타일) ================= */
.w98start, .w98clock { display: none; }
#dsw { position: fixed; z-index: 80; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 8px;
  font: 400 13px/1.4 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #15171C; }
.flow-open #dsw { display: none; }
#dsw .dsw-btn { display: inline-flex; align-items: center; gap: 7px; background: #15171C; color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 7px 14px 7px 10px; font: 600 13px/1.2 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.28); }
#dsw .dsw-btn i { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(#FF6B9D, #FFD23F, #3DDC97, #7AA2FF, #B48CFF, #FF6B9D); display: block; }
#dsw .dsw-panel { width: 288px; max-width: calc(100vw - 24px); max-height: 72vh; overflow-y: auto; background: #FFFFFF; color: #15171C; border: 1px solid rgba(0,0,0,.12); border-radius: 16px; box-shadow: 0 18px 44px rgba(0,0,0,.3); padding: 8px; }
#dsw .dsw-h { font-size: 12px; font-weight: 600; color: #5B6070; padding: 6px 10px 8px; }
#dsw .dsw-panel button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 9px 10px; color: #15171C; cursor: pointer; font: inherit; }
#dsw .dsw-panel button:hover { background: #F3F4F7; }
#dsw .dsw-panel button.on { background: #E9ECF4; }
#dsw .dsw-n { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
#dsw .dsw-n em { font-style: normal; font-size: 11px; font-weight: 500; color: #5B6070; white-space: nowrap; }
#dsw .dsw-panel button.on .dsw-n em { color: #2B4BC8; }
#dsw .dsw-d { display: block; font-size: 12px; color: #4E5363; margin-top: 1px; }
#dsw button:focus-visible { outline: 2px solid #2B4BC8; outline-offset: 2px; }
@media (max-width: 767px) {
  #dsw { bottom: auto; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; flex-direction: column; }
  #app .top { padding-right: 76px; }
}

/* ================= 컨셉 2 · 리퀴드 글래스 (2025) ================= */
[data-concept="glass"] { --bg: #ECEEFB; --card: rgba(255,255,255,.4); --ink: #15172E; --mut: #464C6C; --c: #4A4FE6; --c2: rgba(255,255,255,.62); --ln: rgba(255,255,255,.65); --pos: #0D8049; --neg: #CC3830; color-scheme: light; }
[data-concept="glass"] body { background: #E8EBFA; }
[data-concept="glass"] body::before { content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
  background: radial-gradient(38% 34% at 12% 18%, rgba(110,170,255,.85), transparent 70%), radial-gradient(34% 30% at 88% 12%, rgba(255,150,205,.8), transparent 70%),
    radial-gradient(42% 38% at 72% 88%, rgba(120,235,200,.75), transparent 70%), radial-gradient(36% 34% at 22% 92%, rgba(190,160,255,.8), transparent 70%), #ECEEFB; }
[data-concept="glass"] :is(.card, .qa button, .io div, .mon button, .chips button, .rcp, .inp, .quick button, .rail, .vcard, .flow) {
  background: rgba(255,255,255,.36); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.5), 0 10px 30px rgba(50,60,140,.12); }
[data-concept="glass"] .card { border-radius: 30px; }
[data-concept="glass"] .qa button, [data-concept="glass"] .io div { border-radius: 24px; }
[data-concept="glass"] .tot { border-radius: 32px; background: linear-gradient(140deg, rgba(74,79,230,.85), rgba(34,26,96,.75)); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 0 1px rgba(255,255,255,.22), 0 18px 40px rgba(60,50,180,.3); }
[data-concept="glass"] .tot::after { border-color: rgba(255,255,255,.14); }
[data-concept="glass"] .rail { background: rgba(255,255,255,.34); }
[data-concept="glass"] .rail button { color: #353A60; }
[data-concept="glass"] .rail button:hover { color: var(--ink); }
[data-concept="glass"] .rail button.on { background: rgba(255,255,255,.92); color: var(--ink); box-shadow: inset 0 1px 0 #fff, 0 4px 12px rgba(50,60,140,.18); }
[data-concept="glass"] .rail .brand { color: var(--ink); }
[data-concept="glass"] .rail .sep { background: rgba(20,23,46,.15); }
[data-concept="glass"] .rail button[data-tip]:hover::after { background: rgba(21,23,46,.88); }
[data-concept="glass"] .vcard { color: var(--ink); background: linear-gradient(135deg, rgba(255,255,255,.7), rgba(255,255,255,.2)); border-radius: 28px; }
[data-concept="glass"] .vcard::after { border-color: rgba(74,79,230,.18); }
[data-concept="glass"] .chips button.on { background: var(--ink); color: #fff; }
[data-concept="glass"] .qa i, [data-concept="glass"] .rcp .av { background: rgba(255,255,255,.8); box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(50,60,140,.12); }
[data-concept="glass"] .track { background: rgba(255,255,255,.55); box-shadow: inset 0 1px 2px rgba(20,23,46,.14); }
[data-concept="glass"] .track i { background: linear-gradient(90deg, #7C95FF, #4A4FE6); }
[data-concept="glass"] .track.over i { background: linear-gradient(90deg, #FF8A80, #CC3830); }
[data-concept="glass"] .chart i { background: rgba(255,255,255,.7); box-shadow: inset 0 1px 0 #fff, 0 4px 10px rgba(50,60,140,.1); }
[data-concept="glass"] .chart .now i { background: linear-gradient(#8C9BFF, #4A4FE6); }
[data-concept="glass"] .sendbtn, [data-concept="glass"] .fbtn, [data-concept="glass"] .done i { background: linear-gradient(135deg, #6070FF, #4536D0); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 8px 20px rgba(74,79,230,.35); }
[data-concept="glass"] .flowwrap { background: rgba(232,235,250,.55); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); }
[data-concept="glass"] .sw { background: rgba(20,23,46,.16); }

function sparkline() {

  const isW = concept === 'win98';
  const header = `<header class="top"><b>${TITLE[S.tab]}</b><div class="acts"><button class="sendbtn" data-a="send">${ic('send', 16)} 송금하기</button>
      <button class="ib" data-a="noop" aria-label="알림">${ic('bell', 22)}<span class="dot"></span></button><button class="ib desk" data-a="noop" aria-label="내 정보">${ic('user', 22)}</button></div></header>`;
  const content = !isW ? header + page : `<div class="w98win"><div class="w98title"><span><i class="w98ico"></i>머니로그 - [${TABS.find(t => t[0] === S.tab)[1]}]</span>
      <span class="w98ctl"><button data-a="noop" aria-label="최소화">─</button><button data-a="noop" aria-label="최대화">□</button><button data-a="noop" aria-label="닫기">×</button></span></div>
      <div class="w98menu" role="menubar">${['파일(F)', '편집(E)', '보기(V)', '도움말(H)'].map(m => `<button data-a="noop" role="menuitem">${m}</button>`).join('')}</div>
      <div class="w98body">${header}${page}</div>
      <div class="w98status"><span>준비</span><span>주거래 잔액 ${hid(won(S.acc[0].v))}</span><span>2026-10-07</span></div></div>`;
  $('#app').innerHTML = `${mobileFlow ? '' : `<nav class="rail" aria-label="주요 메뉴"><span class="brand" aria-hidden="true">${isW ? '<span class="w98start">시작</span><span class="w98ml">ML</span>' : 'ML'}</span>
      ${TABS.map(([k, l, i]) => `<button class="${S.tab === k ? 'on' : ''}" data-a="tab" data-v="${k}" data-tip="${l}" aria-label="${l}" ${S.tab === k ? 'aria-current="page"' : ''}>${ic(i)}<span class="t">${l}</span></button>`).join('')}
      <span class="sep desk" aria-hidden="true"></span><button class="desk" data-a="send" data-tip="송금" aria-label="송금">${ic('send')}</button>${isW ? `<span class="w98clock">${nowHM()}</span>` : ''}</nav>
    <main class="main">${content}</main>`}
    ${S.flow ? flowHtml() : ''}${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ''}`;
  document.body.classList.toggle('flow-open', !!S.flow);
  if (S.flow && dswOpen) { dswOpen = false; renderDsw(); }
  if (fx) { const el = document.getElementById(fx); if (el) { el.focus(); if (keepVal != null && el.value === '') el.value = keepVal; } }
}

/* ---------- 액션 ---------- */
const ACT = {
  tab: v => { S.tab = v; S.bEdit = null; try { history.replaceState(null, '', '#' + v); } catch (_) {} window.scrollTo(0, 0); },
  hide: () => S.hide = !S.hide, send: () => S.flow = { step: 0, amt: '' },
  fclose: () => S.flow = null, fback: () => S.flow.step--, to: v => { S.flow.to = RCP[+v]; S.flow.step = 1; },
  flowbg: (v, el, e) => { if (e.target === el && S.flow.step !== 3) S.flow = null; },
  toacc: () => { const v = (($('#acc') || {}).value || '').replace(/\D/g, ''); if (v.length < 10) return toast('계좌번호를 10자리 이상 입력해 주세요'); S.flow.to = ['새 계좌', '머니뱅크 ••• ' + v.slice(-4)]; S.flow.step = 1; },
  key: v => { let a = S.flow.amt; a = v === '←' ? a.slice(0, -1) : (a + v).replace(/^0+/, ''); if (a.length <= 9) S.flow.amt = a; },
  qadd: v => { S.flow.amt = v === 'clear' ? '' : String(v === 'all' ? S.acc[0].v : (+S.flow.amt || 0) + +v); },
  fnext: () => S.flow.step = 2,
  fsend: () => { const a = +S.flow.amt; S.acc[0].v -= a; TX[10].unshift({ d: 7, t: nowHM(), n: S.flow.to[0], c: '송금', a: -a }); S.flow.step = 3; },
  txf: v => S.txf = v, mon: v => S.mon = +v,
  bedit: v => S.bEdit = S.bEdit === +v ? null : +v, bstep: v => { const b = S.bud[S.bEdit]; b.b = Math.max(10000, b.b + 10000 * v); },
  cset: v => { S.cardSet[v] = !S.cardSet[v]; if (v === 'lock') toast(S.cardSet.lock ? '카드를 일시 정지했어요' : '카드를 다시 쓸 수 있어요'); },
  noop: () => toast('예시 화면이라 이동하지 않아요')
};
const amtValid = () => { const a = +S.flow.amt || 0; return a > 0 && a <= S.acc[0].v && a <= 5000000; };

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled || !ACT[b.dataset.a]) return;
  ACT[b.dataset.a](b.dataset.v, b, e); render();
});
document.addEventListener('keydown', e => {
  if (e.target.dataset && e.target.dataset.enter && e.key === 'Enter') { e.preventDefault(); ACT[e.target.dataset.enter](); render(); return; }
  if (!S.flow) return;
  if (e.key === 'Escape') { S.flow = null; render(); return; }
  if (S.flow.step === 1 && e.target.tagName !== 'INPUT' && !(e.key === 'Enter' && e.target.tagName === 'BUTTON')) {
    if (/^[0-9]$/.test(e.key)) { ACT.key(e.key); render(); e.preventDefault(); }
    else if (e.key === 'Backspace') { ACT.key('←'); render(); e.preventDefault(); }
    else if (e.key === 'Enter' && amtValid()) { ACT.fnext(); render(); e.preventDefault(); }
  }
});
mqWide.addEventListener('change', render); mqTab.addEventListener('change', render);

/* ---------- 디자인 전환 ---------- */
const dswEl = document.createElement('div');
dswEl.id = 'dsw';
document.body.appendChild(dswEl);
function renderDsw() {
  dswEl.innerHTML = `<button class="dsw-btn" data-c="toggle" aria-expanded="${dswOpen}" aria-haspopup="true"><i aria-hidden="true"></i>디자인</button>
    ${dswOpen ? `<div class="dsw-panel" role="menu" aria-label="디자인 컨셉"><div class="dsw-h">디자인 컨셉 6가지</div>
      ${CONCEPTS.map(([id, n, era, d]) => `<button role="menuitemradio" aria-checked="${id === concept}" class="${id === concept ? 'on' : ''}" data-c="${id}"><span class="dsw-n">${n}<em>${era}${id === concept ? ' · 사용 중' : ''}</em></span><span class="dsw-d">${d}</span></button>`).join('')}</div>` : ''}`;
}
window.setConcept = id => {
  if (!CONCEPTS.some(x => x[0] === id)) return;
  concept = id; document.documentElement.dataset.concept = id;
  try { localStorage.setItem('design-concept', id); } catch (e) {}
  render(); renderDsw();
};
dswEl.addEventListener('click', e => {
  const b = e.target.closest('[data-c]'); if (!b) return;
  e.stopPropagation();
  if (b.dataset.c === 'toggle') { dswOpen = !dswOpen; renderDsw(); if (dswOpen) { const on = dswEl.querySelector('.dsw-panel .on'); if (on) on.focus(); } }
  else { dswOpen = false; window.setConcept(b.dataset.c); const t = dswEl.querySelector('.dsw-btn'); if (t) t.focus(); }
});
document.addEventListener('click', e => { if (dswOpen && !e.target.closest('#dsw')) { dswOpen = false; renderDsw(); } }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && dswOpen) { dswOpen = false; renderDsw(); const t = dswEl.querySelector('.dsw-btn'); if (t) t.focus(); e.stopImmediatePropagation(); e.preventDefault(); }
}, true);
renderDsw();
render();
</script>

</body>
</html>
