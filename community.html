<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>동네생활</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 모바일 = 상단 피드 탭 + 하단 5칸 내비(가운데 글쓰기) / 태블릿 = 왼쪽 내비 + 피드 / 데스크톱 = 헤더 + 왼쪽 내비 · 가운데 피드 · 오른쪽 사이드바 */
:root {
  --paper: #FBFBF8; --ink: #1B2621; --c: #2C6B4E; --c2: #E3EFE8; --mut: #6F7A74; --ln: #E4E6DF; --white: #FFFFFF; --red: #D9533A; --err: #C2412B;
  --serif: "Nanum Myeongjo", "AppleMyungjo", serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--sans); font-size: 15px; line-height: 1.6; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.serif { font-family: var(--serif); }
.ib { background: none; border: 0; padding: 8px; display: grid; place-items: center; position: relative; border-radius: 10px; }
.ib:hover { background: var(--c2); }
.badge { position: absolute; top: 2px; right: 2px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center; padding: 0 4px; }
.meta { font-size: 12px; color: var(--mut); }
.num { font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 56px 20px; color: var(--mut); font-size: 14px; }

/* header (tablet/desktop) */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--ln); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 16px; }
.logo { font-family: var(--serif); font-weight: 800; font-size: 24px; background: none; border: 0; padding: 0; color: var(--c); letter-spacing: -.02em; }
.loc { background: none; border: 1px solid var(--ln); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--mut); }
.hsearch { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; background: var(--white); border: 1px solid var(--ln); border-radius: 12px; padding: 0 12px; }
.hsearch input { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 0; outline: none; }
.hsearch:focus-within { border-color: var(--c); }
.top .sp { flex: 1; }
.wbtn { border: 0; background: var(--c); color: #fff; border-radius: 12px; padding: 9px 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.wbtn:hover { filter: brightness(1.08); }
.av { width: 36px; height: 36px; border-radius: 50%; background: var(--c2); color: var(--c); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; border: 0; }
.drop { position: absolute; right: 0; top: calc(100% + 8px); width: 360px; background: var(--white); border: 1px solid var(--ln); border-radius: 16px; box-shadow: 0 18px 40px -16px rgba(27,38,33,.3); overflow: hidden; }
.drop-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--ln); }
.bellwrap { position: relative; }

/* shell */
.shell { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; gap: 32px; padding: 24px 24px 64px; align-items: start; }
.left, .right { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); display: flex; flex-direction: column; gap: 20px; }
.lnav { display: flex; flex-direction: column; gap: 2px; }
.lnav button { background: none; border: 0; text-align: left; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 15px; color: var(--mut); position: relative; }
.lnav button:hover { background: var(--c2); color: var(--ink); }
.lnav button.on { color: var(--ink); font-weight: 700; background: var(--c2); }
.lnav .cnt { margin-left: auto; font-size: 11px; background: var(--red); color: #fff; border-radius: 9px; padding: 0 6px; font-weight: 700; }
.side-h { font-family: var(--serif); font-weight: 800; font-size: 16px; margin: 0 0 8px; }
.cats { display: flex; flex-direction: column; gap: 2px; }
.cats button { background: none; border: 0; text-align: left; padding: 6px 12px; border-radius: 8px; font-size: 14px; color: var(--mut); display: flex; justify-content: space-between; }
.cats button:hover { color: var(--ink); }
.cats button.on { color: var(--c); font-weight: 700; }
.box { background: var(--white); border: 1px solid var(--ln); border-radius: 16px; padding: 16px 18px; }
main { min-width: 0; }
.feedwrap { background: var(--white); border: 1px solid var(--ln); border-radius: 16px; overflow: hidden; }

/* feed */
.tt { display: flex; gap: 20px; padding: 0 20px; border-bottom: 1px solid var(--ln); overflow-x: auto; scrollbar-width: none; background: inherit; }
.tt button { background: none; border: 0; padding: 14px 0 11px; font-size: 15px; color: var(--mut); border-bottom: 2px solid transparent; flex: none; }
.tt button.on { color: var(--ink); font-weight: 700; border-color: var(--ink); }
.note { padding: 12px 20px 0; font-size: 12px; color: var(--mut); display: flex; justify-content: space-between; gap: 8px; }
.note button { background: none; border: 0; color: var(--c); font-size: 12px; padding: 0; }
.post { padding: 18px 20px; border-bottom: 1px solid var(--ln); display: flex; flex-direction: column; gap: 8px; }
.post:last-child { border-bottom: 0; }
.post .open { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.post .open:hover h4 { color: var(--c); }
.cat { font-size: 11px; font-weight: 700; color: var(--c); letter-spacing: .03em; }
.post h4 { margin: 0; font-family: var(--serif); font-size: 18px; line-height: 1.4; font-weight: 800; text-wrap: balance; }
.post p { margin: 0; font-size: 14px; color: #4E5853; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.acts { display: flex; gap: 16px; align-items: center; }
.acts button { background: none; border: 0; padding: 2px 0; display: flex; gap: 5px; align-items: center; font-size: 13px; color: var(--mut); }
.acts button:hover { color: var(--ink); }
.acts button.on { color: var(--c); font-weight: 700; }
.acts .sv { margin-left: auto; }

/* explore / alarms / profile */
.pad { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
h3.sec { font-family: var(--serif); margin: 0; font-size: 19px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { border: 1px solid var(--ln); background: var(--white); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.tag:hover { border-color: var(--c); }
.tag.on { background: var(--c); border-color: var(--c); color: #fff; }
.rk { display: flex; flex-direction: column; }
.rk button { background: none; border: 0; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--ln); font-size: 14px; }
.rk button:last-child { border-bottom: 0; }
.rk button:hover span:first-line { color: var(--c); }
.rk b { font-family: var(--serif); font-size: 18px; color: var(--c); line-height: 1.2; }
.grp { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
.grp > div { flex: none; width: 160px; border-radius: 14px; padding: 14px; background: var(--c2); font-size: 12px; color: var(--mut); }
.grp b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }
.right .grp { flex-direction: column; } .right .grp > div { width: auto; }
.al { display: grid; grid-template-columns: 8px 1fr; gap: 12px; padding: 14px 20px; border: 0; border-bottom: 1px solid var(--ln); background: none; text-align: left; width: 100%; }
.al:last-child { border-bottom: 0; }
.al:hover { background: var(--paper); }
.al i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-top: 8px; }
.al.read i { background: transparent; } .al.read { color: var(--mut); }
.al b { font-size: 14px; font-weight: 500; display: block; } .al span { font-size: 12px; color: var(--mut); }
.me { display: flex; flex-direction: column; gap: 6px; padding: 24px 20px 16px; }
.me h2 { font-family: var(--serif); margin: 0; font-size: 26px; }
.stats { display: flex; gap: 18px; font-size: 13px; color: var(--mut); flex-wrap: wrap; } .stats b { color: var(--ink); }
.ver { display: inline-block; font-size: 11px; color: var(--c); background: var(--c2); padding: 2px 8px; border-radius: 6px; font-weight: 700; align-self: flex-start; }

/* detail */
.back { display: flex; align-items: center; padding: 8px 10px; gap: 4px; border-bottom: 1px solid var(--ln); }
.back .t { flex: 1; font-size: 14px; color: var(--mut); }
.art { padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; }
.art h2 { font-family: var(--serif); font-size: 26px; line-height: 1.35; margin: 0; text-wrap: balance; }
.art p { margin: 0; font-size: 16px; line-height: 1.8; max-width: 62ch; white-space: pre-wrap; }
.who { display: flex; gap: 10px; align-items: center; }
.ch { padding: 10px 24px; font-size: 14px; font-weight: 700; border-top: 1px solid var(--ln); }
.cmt { display: flex; gap: 10px; padding: 12px 24px; border-top: 1px solid var(--ln); font-size: 14px; }
.cmt .av { width: 30px; height: 30px; font-size: 11px; }
.cin { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--ln); background: var(--white); }
.fld { flex: 1; min-width: 0; border: 1px solid var(--ln); border-radius: 10px; padding: 10px 12px; font-size: 14px; background: var(--white); width: 100%; }
.fld:focus { border-color: var(--c); outline: none; }
.go { border: 0; background: var(--c); color: #fff; border-radius: 10px; padding: 0 18px; font-weight: 700; }
textarea.fld { min-height: 140px; resize: vertical; line-height: 1.6; }
.err { color: var(--err); font-size: 13px; }

/* write: sheet (mobile) / modal (desktop) */
.scrim { position: fixed; inset: 0; background: rgba(15,22,18,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; }
.dlg { width: 100%; max-width: 560px; background: var(--paper); border-radius: 20px; padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 60px -20px rgba(0,0,0,.4); }
.dlg-h { display: flex; justify-content: space-between; align-items: center; }
.dlg-h h3 { margin: 0; font-family: var(--serif); font-size: 21px; }
.grab { display: none; }
.dlg .go { padding: 13px; font-size: 15px; }

/* mobile pieces */
.mhd { display: none; }
.bn { display: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 32px; z-index: 60; background: var(--ink); color: var(--paper); font-size: 14px; padding: 10px 18px; border-radius: 999px; white-space: nowrap; }

/* tablet */
@media (max-width: 1023px) {
  .shell { grid-template-columns: 200px minmax(0, 1fr); gap: 24px; }
  .right { display: none; }
  .hsearch { max-width: 300px; }
}
/* mobile */
@media (max-width: 767px) {
  body { font-size: 15px; }
  .top, .left { display: none; }
  .shell { display: block; padding: 0 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
  .feedwrap { border: 0; border-radius: 0; background: var(--paper); }
  .tt { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 5; background: var(--paper); padding: 0 16px; }
  .post, .pad, .note { padding-left: 16px; padding-right: 16px; }
  .mhd { display: flex; align-items: center; gap: 4px; padding: 10px 8px 6px 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--paper); height: 56px; }
  .mhd .t { flex: 1; font-family: var(--serif); font-weight: 800; font-size: 21px; }
  .mhd .t small { font-family: var(--sans); font-size: 12px; color: var(--mut); font-weight: 400; margin-left: 4px; }
  .bn { display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--paper); border-top: 1px solid var(--ln); padding: 6px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
  .bn button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--mut); position: relative; }
  .bn button.on { color: var(--ink); font-weight: 700; }
  .bn .badge { right: calc(50% - 22px); }
  .fab { width: 50px; height: 50px; border-radius: 16px; background: var(--c); color: #fff; margin-top: -20px; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(44,107,78,.35); }
  .art { padding: 18px 16px; } .art h2 { font-size: 22px; } .art p { font-size: 15px; }
  .cmt, .ch { padding-left: 16px; padding-right: 16px; }
  .back { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 6; }
  .cin { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .detail-m .bn { display: none; }
  .scrim { align-items: flex-end; padding: 0; }
  .dlg { max-width: none; border-radius: 22px 22px 0 0; padding: 10px 18px calc(24px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; animation: up .22s ease-out; }
  .grab { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--ink); opacity: .2; margin: 0 auto 4px; }
  .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ===================== 디자인 스위처 (모든 컨셉 공통, 중립 스타일) ===================== */
#dz { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 45; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #15171C; }
#dz button { font-family: inherit; }
.dz-btn { background: #FFFFFF; color: #15171C; border: 1px solid rgba(0,0,0,.18); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; box-shadow: 0 6px 18px -6px rgba(0,0,0,.4); }
.dz-btn:focus-visible, .dz-item:focus-visible { outline: 2px solid #3D5AFE; outline-offset: 2px; }
.dz-panel { position: absolute; left: 0; bottom: calc(100% + 8px); width: 310px; max-width: calc(100vw - 32px); max-height: 72vh; overflow-y: auto; background: #FFFFFF; color: #15171C; border: 1px solid rgba(0,0,0,.12); border-radius: 14px; padding: 6px; box-shadow: 0 18px 44px -12px rgba(0,0,0,.45); }
.dz-h { font-size: 12px; font-weight: 700; color: #5A5F70; padding: 8px 10px 4px; letter-spacing: .02em; }
.dz-item { display: grid; gap: 1px; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 9px 10px; color: #15171C; }
.dz-item:hover { background: #F2F3F7; }
.dz-item.on { background: #EAEEFF; }
.dz-n { font-size: 14px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.dz-n em { font-style: normal; font-size: 10px; font-weight: 700; color: #FFFFFF; background: #3D5AFE; border-radius: 6px; padding: 1px 6px; }
.dz-era { font-size: 11px; color: #5A5F70; }
.dz-d { font-size: 12px; color: #3A3F4C; line-height: 1.45; }
@media (max-width: 767px) {
  #dz { left: auto; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  .dz-panel { left: auto; right: 0; }
  .dz-btn { padding: 7px 12px; font-size: 12px; }
}
.shell.nob { grid-template-columns: 220px minmax(0, 1fr); }
.av { white-space: nowrap; }
[data-concept="brutal"] .av, [data-concept="skeuo"] .av { font-size: 11px; letter-spacing: -.04em; }
.w98cnt, .w98bar { display: none; }

/* ===================== 2. 리퀴드 글래스 (2025) ===================== */
[data-concept="glass"] { --paper: #EEF0FF; --ink: #16142E; --c: #5B45F0; --c2: rgba(91,69,240,.12); --mut: #55577A; --ln: rgba(255,255,255,.65); --white: rgba(255,255,255,.55); --red: #F0457A; --serif: "Noto Sans KR", sans-serif; --gl: rgba(255,255,255,.42); --glb: blur(24px) saturate(180%); color-scheme: light; }
[data-concept="glass"] body { background: radial-gradient(55% 45% at 8% 6%, #FFC2E2 0, transparent 70%), radial-gradient(45% 45% at 92% 12%, #9EC5FF 0, transparent 70%), radial-gradient(55% 55% at 62% 100%, #B6F2D8 0, transparent 70%), radial-gradient(40% 40% at 30% 60%, #D9C8FF 0, transparent 70%), #EEF0FF; background-attachment: fixed; min-height: 100vh; }
[data-concept="glass"] .top, [data-concept="glass"] .box, [data-concept="glass"] .fw-home .post, [data-concept="glass"] .fw-home .tt, [data-concept="glass"] .drop, [data-concept="glass"] .dlg, [data-concept="glass"] .mhd, [data-concept="glass"] .bn, [data-concept="glass"] .left .lnav, [data-concept="glass"] .catbox {
  background: var(--gl); -webkit-backdrop-filter: var(--glb); backdrop-filter: var(--glb); border: 1px solid rgba(255,255,255,.7);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.25), 0 12px 32px -14px rgba(60,40,160,.32); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { [data-concept="glass"] { --gl: rgba(255,255,255,.86); } }
[data-concept="glass"] .top { border-radius: 999px; margin: 12px auto 0; max-width: 1180px; width: calc(100% - 32px); top: calc(env(safe-area-inset-top, 0px) + 12px); }
[data-concept="glass"] .top-in { padding: 8px 10px 8px 22px; }
[data-concept="glass"] .logo { color: var(--ink); font-family: var(--sans); font-weight: 900; letter-spacing: -.04em; }
[data-concept="glass"] .hsearch, [data-concept="glass"] .loc { background: rgba(255,255,255,.55); border-color: rgba(255,255,255,.85); border-radius: 999px; }
[data-concept="glass"] .wbtn, [data-concept="glass"] .go { background: linear-gradient(135deg, #6A4CFF, #C247F5); border-radius: 999px; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 8px 20px -8px rgba(106,76,255,.75); }
[data-concept="glass"] .left .lnav, [data-concept="glass"] .catbox { border-radius: 26px; padding: 8px; }
[data-concept="glass"] .lnav button, [data-concept="glass"] .cats button { border-radius: 999px; }
[data-concept="glass"] .lnav button:hover { background: rgba(255,255,255,.5); }
[data-concept="glass"] .lnav button.on { background: rgba(255,255,255,.85); box-shadow: inset 0 1px 0 #fff, 0 4px 12px -6px rgba(60,40,160,.45); }
[data-concept="glass"] .box { border-radius: 28px; padding: 18px 20px; }
[data-concept="glass"] .side-h, [data-concept="glass"] h3.sec, [data-concept="glass"] .me h2, [data-concept="glass"] .art h2, [data-concept="glass"] .dlg-h h3 { font-family: var(--sans); font-weight: 900; letter-spacing: -.03em; }
[data-concept="glass"] .feedwrap { border-radius: 30px; border: 1px solid rgba(255,255,255,.75); background: rgba(255,255,255,.62); box-shadow: inset 0 1px 0 #fff, 0 12px 32px -14px rgba(60,40,160,.3); }
[data-concept="glass"] .feedwrap.fw-home { background: transparent; border: 0; box-shadow: none; overflow: visible; border-radius: 0; }
[data-concept="glass"] .fw-home .tt { border-radius: 999px; padding: 5px; gap: 4px; margin-bottom: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 88px); z-index: 5; }
[data-concept="glass"] .fw-home .tt button { padding: 8px 18px; border-radius: 999px; border-bottom: 0; }
[data-concept="glass"] .fw-home .tt button.on { background: #FFFFFF; color: var(--c); box-shadow: 0 4px 14px -6px rgba(60,40,160,.5); }
[data-concept="glass"] .fw-home .post { border-radius: 26px; margin-bottom: 14px; padding: 20px 22px; }
[data-concept="glass"] .post h4 { font-family: var(--sans); font-weight: 800; letter-spacing: -.02em; }
[data-concept="glass"] .post p { color: #45476A; }
[data-concept="glass"] .cat { align-self: flex-start; background: rgba(255,255,255,.75); padding: 2px 10px; border-radius: 999px; }
[data-concept="glass"] .tag { background: rgba(255,255,255,.55); border-color: rgba(255,255,255,.9); }
[data-concept="glass"] .tag.on { background: var(--c); border-color: var(--c); }
[data-concept="glass"] .fw-home .note { background: rgba(255,255,255,.6); border-radius: 999px; padding: 8px 16px; margin-bottom: 12px; }
[data-concept="glass"] .fw-home .empty { background: rgba(255,255,255,.55); border-radius: 26px; }
[data-concept="glass"] .dlg { background: rgba(255,255,255,.75); border-radius: 32px; }

    <div class="box"><div class="side-h">인기 태그</div>${tagChips()}</div></aside>` : '';
  const nb = [['home', '홈', 'home'], ['explore', '탐색', 'compass'], null, ['alarm', '알림', 'bell'], ['me', '프로필', 'user']];
  const bottom = `<nav class="bn" aria-label="하단 메뉴">${nb.map(n => n ? `<button class="${S.nav === n[0] ? 'on' : ''}" data-a="go" data-v="${n[0]}">${ic(n[2], 22, S.nav === n[0] ? 2.2 : 1.7)}${n[1]}${n[0] === 'alarm' && u ? `<span class="badge">${u}</span>` : ''}</button>`
    : `<button data-a="write" aria-label="글쓰기"><span class="fab">${ic('plus', 24, 2.4)}</span></button>`).join('')}</nav>`;
  $('#app').className = S.det ? 'detail-m' : '';
  $('#app').innerHTML = header + `<div class="shell${bentoOn ? ' nob' : ''}">${left}<main>${mobileHeader()}<div class="feedwrap fw-${S.det ? 'det' : S.nav}">${winBar()}${bentoOn ? bentoView() : mainView()}</div></main>${right}</div>` + bottom + writeDialog() + (S.toast ? `<div class="toast" role="status">${S.toast}</div>` : '');
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}

/* ---------- 동작 ---------- */
const ACT = {
  go: v => { S.nav = v; S.det = null; S.bell = false; if (v === 'home') { S.cat = null; } scrollTo(0, 0); },
  top: v => { S.top = v; S.cat = null; S.q = ''; S.drafts.q = ''; },
  cat: v => { S.cat = v || null; S.q = ''; S.nav = 'home'; S.det = null; scrollTo(0, 0); },
  det: v => { S.det = +v; S.bell = false; scrollTo(0, 0); }, close: () => S.det = null,
  like: v => { v = +v; S.liked.has(v) ? S.liked.delete(v) : S.liked.add(v); },
  save: v => { v = +v; if (S.saved.has(v)) { S.saved.delete(v); toast('저장을 취소했어요'); } else { S.saved.add(v); toast('프로필 > 저장에 담았어요'); } },
  cmt: () => { const t = (S.drafts.c3 || '').trim(); if (!t) return toast('댓글 내용을 입력해 주세요'); const p = P(S.det); p.cm.push([ME, t]); S.myCm.unshift([p.a, t]); S.drafts.c3 = ''; toast('댓글을 남겼어요'); },
  write: () => { S.write = true; S.werr = ''; S.bell = false; setTimeout(() => { const el = $('#w3t'); if (el) el.focus(); }, 0); },
  wclose: () => S.write = false, wbg: (v, el, e) => { if (e.target === el) S.write = false; }, wcat: v => S.wcat = v,
  wsave: () => { const t = (S.drafts.w3t || '').trim(), b = (S.drafts.w3b || '').trim();
    if (t.length < 2) { S.werr = '제목을 2자 이상 입력해 주세요'; return; } if (b.length < 5) { S.werr = '내용을 5자 이상 입력해 주세요'; return; }
    S.posts.unshift({ id: Date.now(), cat: S.wcat, title: t, body: b, a: ME, area: '성수2가', time: '방금', likes: 0, cm: [], tabs: ['추천', '동네', '인기', '팔로잉'], tag: '동네소식' });
    S.write = false; S.nav = 'home'; S.top = '추천'; S.cat = null; S.q = ''; S.det = null; S.drafts.w3t = ''; S.drafts.w3b = ''; S.werr = ''; toast('글을 올렸어요'); scrollTo(0, 0); },
  search: id => { const q = (S.drafts[id || 'q'] || '').trim(); S.q = q; S.cat = null; S.nav = 'home'; S.det = null; S.drafts.qm = ''; if (!q) S.drafts.q = ''; },
  clearq: () => { S.q = ''; S.drafts.q = ''; },
  tag: v => S.tag = S.tag === v ? null : v,
  readall: () => S.alarms.forEach(a => a.read = true),
  alarm: v => { const a = S.alarms[+v]; a.read = true; S.det = a.p; S.bell = false; scrollTo(0, 0); },
  bell: () => { if (isDesk() || !isMob()) S.bell = !S.bell; else S.nav = 'alarm'; },
  metab: v => S.meTab = +v, noop: () => toast('예시 화면이라 이동하지 않아요')
};

document.addEventListener('click', e => {
  const z = e.target.closest('[data-dz]');
  if (z) { const v = z.dataset.dz; if (v === 'toggle') { dzOpen = !dzOpen; renderDz(); } else { dzOpen = false; setConcept(v); } return; }
  if (dzOpen && !e.target.closest('#dz')) { dzOpen = false; renderDz(); }
  const b = e.target.closest('[data-a]');
  if (!b) { if (S.bell && !e.target.closest('.bellwrap')) { S.bell = false; render(); } return; }
  if (b.disabled) return;
  const fn = ACT[b.dataset.a]; if (!fn) return;
  if (S.bell && !b.closest('.bellwrap') && b.dataset.a !== 'bell') S.bell = false;
  fn(b.dataset.v, b, e); render();
});
document.addEventListener('input', e => { if (e.target.id) { S.drafts[e.target.id] = e.target.value; if (e.target.id === 'w3t') { const m = document.querySelector('.dlg .num'); if (m) m.textContent = e.target.value.length + '/40'; } } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && dzOpen) { dzOpen = false; renderDz(); const zb = document.querySelector('.dz-btn'); if (zb) zb.focus(); return; }
  if (e.key === 'Escape') { if (S.write) { S.write = false; render(); } else if (S.bell) { S.bell = false; render(); } return; }
  if (e.key !== 'Enter' || e.isComposing || !e.target.dataset || !e.target.dataset.enter) return;
  e.preventDefault(); ACT[e.target.dataset.enter](e.target.id); render();
});
mqDesk.addEventListener('change', render); mqMob.addEventListener('change', () => { S.bell = false; render(); });
render(); renderDz();
</script>
