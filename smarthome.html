<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>하우스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Black+Han+Sans&family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 모바일=앱 바+드로어 / 태블릿=아이콘 레일 / 데스크톱=고정 사이드바+대시보드+오른쪽 상세 패널. 단일 다크 테마 */
:root {
  --bg: #14161D; --side: #1A1D27; --card: #1E212C; --card2: #282C3A; --line: #2C3040;
  --fg: #ECEDF3; --mut: #8C92A8; --c: #F2B544; --on-c: #14161D; --c-dim: rgba(242,181,68,.14); --cool: #6FA8FF; --good: #5BD39A;
  --font: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mut { color: var(--mut); font-size: 13px; }

.app { display: grid; grid-template-columns: 1fr; min-height: 100%; }
.side { display: none; }
.main { min-width: 0; display: flex; flex-direction: column; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 8px; border-bottom: 1px solid transparent; }
.bar .t { flex: 1; font-size: 18px; font-weight: 800; min-width: 0; }
.bar .t small { display: block; font-size: 12px; font-weight: 400; color: var(--mut); }
.ib { background: none; border: 0; padding: 8px; cursor: pointer; display: grid; place-items: center; position: relative; border-radius: 10px; }
.ib:hover { background: rgba(255,255,255,.05); }
.badge { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--c); color: var(--on-c); font-size: 10px; font-weight: 800; line-height: 16px; text-align: center; padding: 0 4px; }
.content { padding: 4px 16px 32px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 1280px; }
.burger { display: grid; }

/* sidebar / drawer content */
.home-sw { margin: 0 14px 16px; padding: 14px; background: var(--card2); border-radius: 14px; border: 0; text-align: left; cursor: pointer; width: calc(100% - 28px); }
.home-sw b { font-size: 16px; display: block; } .home-sw span { font-size: 12px; color: var(--mut); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 22px 18px; font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.brand i { width: 30px; height: 30px; border-radius: 10px; background: var(--c); color: var(--on-c); display: grid; place-items: center; font-style: normal; }
.dn { background: none; border: 0; display: flex; gap: 14px; align-items: center; padding: 11px 22px; cursor: pointer; font-size: 15px; color: var(--mut); text-align: left; width: 100%; border-radius: 0; }
.dn:hover { color: var(--fg); }
.dn.on { color: var(--fg); font-weight: 700; background: var(--c-dim); box-shadow: inset 3px 0 0 var(--c); }
.dn.on svg { color: var(--c); }
.dsep { height: 1px; background: var(--card2); margin: 8px 22px; }
.who { margin-top: auto; padding: 14px 22px 0; font-size: 12px; color: var(--mut); display: flex; gap: 10px; align-items: center; }
.who i { width: 32px; height: 32px; border-radius: 50%; background: var(--c); color: var(--on-c); display: grid; place-items: center; font-style: normal; font-weight: 800; flex: none; }
.who b { color: var(--fg); display: block; font-size: 13px; }

/* drawer (mobile) */
.drawer { position: fixed; inset: 0; z-index: 30; display: flex; }
.drawer .pnl { width: min(82%, 320px); background: var(--side); height: 100%; padding: calc(env(safe-area-inset-top, 0px) + 24px) 0 calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,.4); animation: slide .2s ease-out; overflow-y: auto; }
.drawer .shade { flex: 1; background: rgba(0,0,0,.55); border: 0; cursor: pointer; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: none; } }

/* dashboard pieces */
.env { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--card2); border-radius: 18px; overflow: hidden; }
.env div { background: var(--card); padding: 12px 14px; font-size: 12px; color: var(--mut); min-width: 0; }
.env b { display: block; color: var(--fg); font-size: 22px; font-weight: 800; }
.env .g { color: var(--good); }
.env .x { display: none; }
.rooms { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.rooms::-webkit-scrollbar { display: none; }
.rooms button { flex: none; border: 1px solid var(--card2); background: none; color: var(--mut); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
.rooms button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 122px; position: relative; min-width: 0; }
.tile.on { background: var(--card2); box-shadow: inset 0 0 0 1px rgba(242,181,68,.35); }
.tile.sel { box-shadow: inset 0 0 0 2px var(--c); }
.tile .op { background: none; border: 0; text-align: left; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.tile .op b { font-size: 14px; } .tile .op span { font-size: 12px; color: var(--mut); }
.tile.on .op span { color: var(--c); }
.tile .ico { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.06); display: grid; place-items: center; color: var(--mut); }
.tile.on .ico { background: var(--c-dim); color: var(--c); }
.tile .sw { position: absolute; right: 12px; top: 14px; }
.sw { width: 44px; height: 26px; border-radius: 13px; border: 0; position: relative; cursor: pointer; flex: none; background: #3A3F52; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .18s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.sw.on { background: var(--c); } .sw.on::after { left: 21px; }
.add { border: 1px dashed var(--line); background: none; border-radius: 16px; padding: 14px; color: var(--mut); cursor: pointer; }
.add:hover { color: var(--fg); border-color: var(--mut); }
.crd { background: var(--card); border-radius: 18px; padding: 16px; min-width: 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-h h2 { margin: 0; font-size: 16px; }

/* detail */
.dial { width: 190px; height: 190px; border-radius: 50%; margin: 10px auto; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 40%, #2C3142, #1B1E28 70%); box-shadow: 0 0 0 8px rgba(242,181,68,.12), 0 0 40px rgba(242,181,68,.15); }
.dial.off { box-shadow: 0 0 0 8px rgba(255,255,255,.04); }
.dial b { font-size: 46px; font-weight: 800; line-height: 1; } .dial small { display: block; color: var(--mut); font-size: 12px; }
.pm { display: flex; justify-content: center; gap: 28px; }
.pm button { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--card2); font-size: 24px; cursor: pointer; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { border: 0; background: var(--card2); color: var(--mut); border-radius: 12px; padding: 10px 0; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--c); color: var(--on-c); font-weight: 700; }
.pw { width: 100%; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; cursor: pointer; background: var(--card2); }
.pw.on { background: var(--c); color: var(--on-c); }
.detail { display: flex; flex-direction: column; gap: 14px; }
.dhead { display: flex; align-items: center; gap: 6px; }
.dhead .t { flex: 1; font-size: 17px; font-weight: 800; }
.dhead .t small { display: block; font-size: 12px; color: var(--mut); font-weight: 400; }

/* scenes / automations */
.scenes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.scene { background: var(--sc, var(--card2)); border: 0; border-radius: 18px; padding: 16px 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 124px; color: var(--fg); }
.scene b { font-size: 16px; } .scene span { font-size: 12px; opacity: .75; line-height: 1.4; }
.scene:hover { filter: brightness(1.12); }
.rules { display: grid; grid-template-columns: 1fr; gap: 10px; }
.rule { background: var(--card); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
.rule.off { opacity: .5; }
.ift { font-size: 13px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ift span { display: flex; gap: 8px; align-items: baseline; }
.ift i { font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; background: rgba(111,168,255,.15); color: var(--cool); flex: none; }
.ift i.th { background: var(--c-dim); color: var(--c); }

/* energy */
.egrid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.ech { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-top: 18px; }
.ech div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 11px; color: var(--mut); }
.ech i { width: 100%; max-width: 56px; border-radius: 6px 6px 2px 2px; background: #3A4054; display: block; }
.ech .now i { background: repeating-linear-gradient(45deg, var(--c), var(--c) 4px, #C9932F 4px, #C9932F 8px); }
.ech em { font-style: normal; color: var(--fg); font-size: 11px; }
.brk { display: flex; flex-direction: column; gap: 12px; }
.bar2 { height: 6px; background: var(--card2); border-radius: 3px; overflow: hidden; margin-top: 4px; } .bar2 i { display: block; height: 100%; background: var(--c); }

/* members / settings */
.mem { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--card2); }
.mem:first-child { border-top: 0; padding-top: 0; }
.mem .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #14161D; flex: none; }
.role { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--card2); color: var(--mut); margin-left: auto; white-space: nowrap; }
.cta { border: 0; background: var(--c); color: var(--on-c); border-radius: 14px; padding: 13px 18px; font-weight: 800; cursor: pointer; }
.two { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--card2); }
.setrow:first-child { border-top: 0; padding-top: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); z-index: 50; background: #F4F4F7; color: #14161D; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 999px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.4); }

/* ---- tablet: icon rail ---- */
@media (min-width: 768px) {
  .app { grid-template-columns: 76px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; background: var(--side); padding: 20px 0; border-right: 1px solid var(--line); overflow-y: auto; }
  .side .brand { padding: 0 0 18px; justify-content: center; } .side .brand span { display: none; }
  .side .home-sw, .side .who b, .side .who span, .side .dn span { display: none; }
  .side .dn { justify-content: center; padding: 12px 0; }
  .side .who { justify-content: center; padding: 14px 0 0; }
  .burger { display: none; }
  .bar { padding: 18px 24px 14px; }
  .content { padding: 4px 24px 40px; }
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .env { grid-template-columns: repeat(4, 1fr); } .env .x { display: block; }
  .scenes { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .rules { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .detail-page { max-width: 520px; }
}
/* ---- desktop: full sidebar + side panel ---- */
@media (min-width: 1024px) {
  .app { grid-template-columns: 248px minmax(0, 1fr); }
  .side .brand { padding: 0 22px 18px; justify-content: flex-start; } .side .brand span { display: inline; }
  .side .home-sw { display: block; } .side .who b, .side .who span { display: block; } .side .dn span { display: inline; }
  .side .dn { justify-content: flex-start; padding: 11px 22px; }
  .side .who { justify-content: flex-start; padding: 14px 22px 0; }
  .bar { padding: 22px 32px 16px; border-bottom-color: var(--line); }
  .bar .t { font-size: 22px; }
  .content { padding: 24px 32px 48px; gap: 20px; }
  .work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
  .work.has-panel { grid-template-columns: minmax(0, 1fr) 360px; }
  .panel { position: sticky; top: 96px; background: var(--side); border: 1px solid var(--line); border-radius: 22px; padding: 18px; max-height: calc(100vh - 120px); overflow-y: auto; }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .has-panel .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .env b { font-size: 26px; } .env div { padding: 16px 18px; }
  .egrid { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  .ech { height: 240px; }
  .rules { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
}
@media (min-width: 1400px) { .rules { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { *, *::after { transition: none !important; animation: none !important; } }

/* ===================== 디자인 스위처 (모든 컨셉 공통, 중립 스타일) ===================== */
.w98c, .w98task { display: none; }
.dzbtn { font: 600 12px/1 -apple-system, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; letter-spacing: 0; text-transform: none; background: #16181D; color: #FFFFFF; border: 1px solid rgba(255,255,255,.4); border-radius: 999px; padding: 8px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.28); text-shadow: none; flex: none; white-space: nowrap; }
.dzbtn:hover { background: #2A2E37; }
.dzbtn:focus-visible { outline: 2px solid #4C8DFF; outline-offset: 2px; }
.dz-float { display: none; position: fixed; left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 60; }
.dzp { position: fixed; z-index: 61; top: calc(env(safe-area-inset-top, 0px) + 60px); right: 12px; width: min(330px, calc(100vw - 24px)); max-height: calc(100vh - 90px); overflow-y: auto; background: #FFFFFF; color: #15181E; border: 1px solid #D3D7DE; border-radius: 16px; box-shadow: 0 18px 50px rgba(0,0,0,.35); padding: 8px; font: 13px/1.45 -apple-system, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; text-shadow: none; letter-spacing: 0; text-transform: none; }
.dzh { font-weight: 700; font-size: 13px; padding: 8px 10px 6px; display: flex; justify-content: space-between; color: #15181E; }
.dzh span { color: #6B7280; font-weight: 400; }
.dzi { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 9px 10px; cursor: pointer; color: #15181E; font: inherit; }
.dzi:hover { background: #F1F3F6; }
.dzi.on { background: #EAF1FF; box-shadow: inset 0 0 0 1.5px #3B6FE0; }
.dzi:focus-visible { outline: 2px solid #3B6FE0; outline-offset: -2px; }
.dzt { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.dzt b { font-size: 14px; }
.dzt em { font-style: normal; font-size: 11px; color: #4B5563; background: #EEF0F3; border-radius: 6px; padding: 1px 6px; }
.dzt i { font-style: normal; font-size: 11px; font-weight: 700; color: #2152C4; margin-left: auto; }
.dzd { font-size: 12px; color: #4B5563; }
@media (min-width: 768px) {
  .dz-inline { display: none; }
  .dz-float { display: inline-flex; }
  .side { padding-bottom: 72px; }
  .dzp { top: auto; right: auto; left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 58px); }
}
@media (min-width: 768px) and (max-width: 1023px) { .dz-float { left: 8px; padding: 8px 9px; font-size: 11px; } .dz-float svg { display: none; } }

/* ===================== 2. 리퀴드 글래스 (2025) ===================== */
html[data-concept="glass"] { --bg: #EEF0FA; --side: rgba(255,255,255,.8); --card: rgba(255,255,255,.8); --card2: rgba(255,255,255,.92); --gl: rgba(255,255,255,.82); --line: rgba(255,255,255,.75); --fg: #151A2D; --mut: #485070; --c: #5048E5; --on-c: #FFFFFF; --c-dim: rgba(80,72,229,.12); --cool: #0B6FA8; --good: #087A52; --font: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; color-scheme: light; }
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html[data-concept="glass"] { --side: rgba(255,255,255,.4); --card: rgba(255,255,255,.44); --card2: rgba(255,255,255,.66); --gl: rgba(255,255,255,.46); }
  [data-concept="glass"] :is(.crd, .tile, .rule, .panel, .home-sw, .env > div, .bar, .side, .drawer .pnl, .scene, .pm button, .dial, .seg, .rooms button, .add, .pw) { -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%); }
}
html[data-concept="glass"] body { background: radial-gradient(55% 45% at 8% 6%, #FFB7DD 0%, transparent 62%), radial-gradient(45% 45% at 92% 4%, #9AD6FF 0%, transparent 62%), radial-gradient(55% 55% at 85% 92%, #C3B1FF 0%, transparent 62%), radial-gradient(50% 50% at 4% 96%, #A6F1D6 0%, transparent 62%), radial-gradient(40% 40% at 50% 50%, #FFE6B8 0%, transparent 70%), #EEF0FA; background-attachment: fixed; }
[data-concept="glass"] :is(.crd, .tile, .rule, .panel, .env > div) { background: var(--card); border: 1px solid rgba(255,255,255,.75); border-radius: 28px; box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.3), 0 10px 30px -8px rgba(50,50,110,.18); }
[data-concept="glass"] .env { background: none; gap: 10px; overflow: visible; border-radius: 0; }
[data-concept="glass"] .env b { font-weight: 700; }
[data-concept="glass"] .tile.on { background: var(--card2); box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1.5px rgba(80,72,229,.35), 0 12px 30px -10px rgba(80,72,229,.35); }
[data-concept="glass"] .tile.sel { box-shadow: inset 0 0 0 2px var(--c), 0 12px 30px -10px rgba(80,72,229,.35); }
[data-concept="glass"] .tile .ico { border-radius: 999px; background: rgba(255,255,255,.65); }
[data-concept="glass"] .tile.on .ico { background: var(--c); color: #fff; }
[data-concept="glass"] .tile.on .op span { color: #3D35C9; }
[data-concept="glass"] .sw { background: rgba(20,24,45,.2); box-shadow: inset 0 1px 2px rgba(0,0,0,.15); }
[data-concept="glass"] .sw.on { background: linear-gradient(135deg, #6C63FF, #3FA9F5); }
[data-concept="glass"] .bar { margin: calc(env(safe-area-inset-top, 0px) + 10px) 10px 4px; top: calc(env(safe-area-inset-top, 0px) + 10px); border-radius: 999px; background: var(--gl); border: 1px solid rgba(255,255,255,.8); box-shadow: inset 0 1px 0 #fff, 0 10px 30px -10px rgba(50,50,110,.25); padding: 6px 8px 6px 6px; }
[data-concept="glass"] .ib { border-radius: 999px; }
[data-concept="glass"] .ib:hover { background: rgba(255,255,255,.55); }
[data-concept="glass"] .rooms button { border: 1px solid rgba(255,255,255,.8); background: rgba(255,255,255,.45); color: var(--fg); }
[data-concept="glass"] .rooms button.on { background: #151A2D; color: #fff; border-color: #151A2D; }
[data-concept="glass"] :is(.seg button, .pw, .cta, .pm button, .home-sw) { border-radius: 999px; }
[data-concept="glass"] .seg { background: rgba(255,255,255,.35); padding: 4px; border-radius: 999px; border: 1px solid rgba(255,255,255,.75); gap: 4px; }
[data-concept="glass"] .seg button { background: transparent; color: var(--mut); }
[data-concept="glass"] .seg button.on { background: #fff; color: var(--fg); box-shadow: 0 4px 12px rgba(50,50,110,.18); }

.lb { color: var(--mut); }
.bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

const dzBtn = cls => `<button class="dz dzbtn ${cls}" data-a="dz" aria-expanded="${!!S.dz}" aria-haspopup="true">${ic('scene', 14, 2)}디자인</button>`;
const dzPanel = () => `<div class="dz dzp" role="dialog" aria-label="디자인 컨셉 선택"><div class="dzh">디자인 컨셉 <span>${CONCEPTS.length}종</span></div>
  ${CONCEPTS.map(([id, n, era, d]) => `<button class="dzi ${concept === id ? 'on' : ''}" data-a="concept" data-v="${id}" aria-pressed="${concept === id}"><span class="dzt"><b>${n}</b><em>${era}</em>${concept === id ? '<i>사용 중</i>' : ''}</span><span class="dzd">${d}</span></button>`).join('')}</div>`;

/* ---------- 렌더 ---------- */
function render() {
  const desk = mqDesk.matches;
  const title = S.page === 'dash' ? '우리집' : PAGES.find(p => p[0] === S.page)[1];
  const sub = { dash: '10월 7일 수요일 · 기기 8대', scene: '한 번에 여러 기기 바꾸기', auto: '조건에 따라 자동 실행', energy: '2026년 10월', members: '4명', settings: '알림과 앱 설정' }[S.page];
  const panelOpen = desk && S.det && S.page === 'dash';
  const fullDetail = !desk && S.det;
  const main = fullDetail ? `<div class="content">${detailHtml(false)}</div>`
    : `<header class="bar"><button class="ib burger" data-a="drawer" aria-label="메뉴 열기">${ic('menu')}</button><div class="t">${title}<small>${sub}</small></div>${dzBtn('dz-inline')}<button class="ib" data-a="noop" aria-label="알림 2개">${ic('bell')}<span class="badge">2</span></button>${concept === 'win98' ? '<span class="w98c" aria-hidden="true"><i>─</i><i>□</i><i>×</i></span>' : ''}</header>
      <div class="content"><div class="work ${panelOpen ? 'has-panel' : ''}"><div style="display:flex;flex-direction:column;gap:16px;min-width:0">${pageHtml(desk)}</div>${panelOpen ? `<aside class="panel" aria-label="기기 상세">${detailHtml(true)}</aside>` : ''}</div></div>`;
  const drawer = S.drawer && !matchMedia('(min-width: 768px)').matches ? `<div class="drawer"><div class="pnl" role="dialog" aria-label="메뉴">${navHtml()}</div><button class="shade" data-a="drawer" aria-label="메뉴 닫기"></button></div>` : '';
  const fx = document.activeElement && document.activeElement.dataset ? [document.activeElement.dataset.a, document.activeElement.dataset.v] : null;
  const task = concept === 'win98' && !matchMedia('(min-width: 768px)').matches ? `<div class="w98task"><button class="w98start" data-a="drawer" aria-pressed="${S.drawer}">${ic('home', 14, 2.4)}시작</button><span class="w98tb">${fullDetail ? S.dev.find(x => x.id === S.det).n : title}</span><span class="w98clk">오후 2:14</span></div>` : '';
  document.getElementById('root').innerHTML = `<div class="app"><aside class="side">${navHtml()}</aside><main class="main">${main}</main></div>${drawer}${task}${dzBtn('dz-float')}${S.dz ? dzPanel() : ''}${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ''}`;
  if (fx && fx[0]) { const el = document.querySelector(`.main [data-a="${fx[0]}"]${fx[1] !== undefined ? `[data-v="${fx[1]}"]` : ''}`); if (el) el.focus({ preventScroll: true }); }
}

/* ---------- 액션 ---------- */
const ACT = {
  drawer: () => S.drawer = !S.drawer,
  page: v => { S.page = v; S.drawer = false; S.det = null; window.scrollTo(0, 0); },
  room: v => S.room = v,
  tog: v => { const d = S.dev.find(x => x.id === +v); d.on = !d.on; if (d.k === 'robot') d.v = d.on ? '청소 중' : '충전 중 92%'; },
  det: v => { S.det = S.det === +v && mqDesk.matches ? null : +v; if (!mqDesk.matches) window.scrollTo(0, 0); },
  close: () => S.det = null,
  step: v => { const d = S.dev.find(x => x.id === S.det), st = STEP[d.k]; d.v = Math.max(st[1], Math.min(st[2], d.v + st[0] * v)); d.on = true; },
  acm: v => { const d = S.dev.find(x => x.id === S.det); d.m = v; d.on = true; },
  airm: v => { const d = S.dev.find(x => x.id === S.det); d.v = v; d.on = true; },
  hotlock: () => { const d = S.dev.find(x => x.id === S.det); d.v = d.v === '온수 잠금' ? '온수 사용 가능' : '온수 잠금'; },
  saver: () => S.saver = !S.saver,
  scene: v => { const b = JSON.stringify(S.dev.map(d => [d.on, d.v])); SCN[+v].f(S.dev); const a = S.dev.map(d => [d.on, d.v]), bb = JSON.parse(b);
    const n = a.filter((x, i) => JSON.stringify(x) !== JSON.stringify(bb[i])).length; toast(`${SCN[+v].n} 장면 실행 · 기기 ${n}대 변경`); },
  auto: v => S.autos[+v].on = !S.autos[+v].on,
  addauto: () => { S.autos.push({ on: true, i: '일몰 시간이 되면', t: '거실 조명 60%로 켜기' }); toast('자동화를 추가했어요'); },
  set: v => S.set[v] = !S.set[v],
  invite: () => toast('초대 링크를 만들었어요 (예시)'),
  noop: () => toast('예시 화면이라 이동하지 않아요'),
  dz: () => S.dz = !S.dz,
  concept: v => setConcept(v)
};
document.addEventListener('click', e => {
  if (S.dz && !e.target.closest('.dz')) { S.dz = false; if (!e.target.closest('[data-a]')) { render(); return; } }
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.a]; if (!fn) return;
  fn(b.dataset.v); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.dz || S.drawer || S.det)) { if (S.dz) S.dz = false; else if (S.drawer) S.drawer = false; else S.det = null; render(); } });
mqDesk.addEventListener('change', render);
matchMedia('(min-width: 768px)').addEventListener('change', () => { S.drawer = false; render(); });
render();
</script>

</body>
</html>
